name: Validate cleanup queue collaboration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: validate-cleanup-queue-collaboration
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: cleanup-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cleanup-queue-collaboration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Apply implementation and regenerate API clients
        run: |
          python .agent/apply-cleanup-queue-collaboration.py
          pnpm --filter @workspace/api-spec run codegen

      - name: Format touched source
        run: |
          pnpm exec prettier --write \
            lib/db/src/schema/cleanupQueue.ts \
            lib/db/migrations/0220_cleanup_queue_collaboration.sql \
            artifacts/api-server/src/routes/cleanupQueue.ts \
            artifacts/api-server/src/__tests__/flag-for-research.integration.test.ts \
            artifacts/wildflower-crm/src/pages/cleanup-queue.tsx

      - name: Build schema and validate contract
        run: |
          pnpm --filter @workspace/db run push-force
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0220_cleanup_queue_collaboration.sql
          pnpm run check:codegen

      - name: Typecheck and test
        run: |
          pnpm run check:api
          pnpm run check:web
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/flag-for-research.integration.test.ts \
            src/__tests__/flagged-for-research-derivation.integration.test.ts

      - name: Commit validated implementation
        run: |
          rm -rf .agent
          rm -f .github/workflows/validate-cleanup-queue-collaboration.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make cleanup queue notes collaborative"
          git push origin HEAD:agent/cleanup-queue-collaboration
