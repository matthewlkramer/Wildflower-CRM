name: Validate giving relationship record views

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.head_ref == 'agent/giving-relationship-record-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_giving_relationship
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_giving_relationship"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_giving_relationship
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: giving-relationship-test-key

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/giving-relationship-record-pages
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Establish current schema
        run: pnpm --filter @workspace/db run push-force

      - name: Apply giving relationship patch
        run: |
          cat .github/scripts/apply_giving_relationship.py.gz.b64.part* > /tmp/giving.b64
          base64 -d /tmp/giving.b64 | gzip -d > /tmp/apply_giving_relationship.py
          python /tmp/apply_giving_relationship.py

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/routes/givingRelationships.ts \
            artifacts/api-server/src/routes/index.ts \
            artifacts/api-server/src/__tests__/giving-relationship.integration.test.ts \
            artifacts/wildflower-crm/src/components/giving-relationship-card.tsx \
            artifacts/wildflower-crm/src/pages/individual-detail.tsx \
            artifacts/wildflower-crm/src/pages/funding-entity-detail.tsx \
            artifacts/wildflower-crm/src/pages/household-detail.tsx \
            lib/api-spec/openapi.yaml \
            docs/giving-relationship-record-views.md

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web

      - name: Run focused integration tests
        run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/giving-relationship.integration.test.ts

      - name: Remove temporary validation machinery
        run: |
          rm -f .github/workflows/validate-giving-relationship.yml
          rm -f .github/scripts/apply_giving_relationship.py.gz.b64.part*

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add giving relationship record views"
          git push origin HEAD:agent/giving-relationship-record-pages
