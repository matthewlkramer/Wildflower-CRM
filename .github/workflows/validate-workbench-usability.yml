name: Validate workbench usability

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: validate-workbench-usability-pr
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: reconciliation-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workbench-alignment-search-undo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Apply implementation
        run: |
          python .agent/fix-apply-anchor.py
          python .agent/fix-apply-anchor-2.py
          python .agent/fix-apply-anchor-3.py
          python .agent/fix-apply-anchor-4.py
          python .agent/apply-workbench-usability.py

      - name: Format touched source
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/routes/reconciliation/recentChanges.ts \
            artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts \
            artifacts/api-server/src/__tests__/workbench-recent-changes.integration.test.ts \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/presentation.test.ts \
            artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx

      - name: Build schema and typecheck
        run: |
          pnpm --filter @workspace/db run push-force
          pnpm run check:api
          pnpm run check:web

      - name: Run focused tests
        run: |
          pnpm --filter @workspace/wildflower-crm exec vitest run \
            src/components/reconciliation-deposits/presentation.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/routes/reconciliation/workbenchDepositState.test.ts \
            src/__tests__/workbench-deposits.integration.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/workbench-recent-changes.integration.test.ts

      - name: Commit validated implementation
        run: |
          rm -rf .agent
          rm -f .github/workflows/inspect-workbench.yml
          rm -f .github/workflows/inspect-workbench-pr.yml
          rm -f .github/workflows/inspect-candidate-api.yml
          rm -f .github/workflows/inspect-contract.yml
          rm -f .github/workflows/inspect-contract-locate.yml
          rm -f .github/workflows/validate-workbench-usability.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve reconciliation workbench alignment and search"
          git push origin HEAD:agent/workbench-alignment-search-undo
