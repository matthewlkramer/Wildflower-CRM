name: Validate preferred donor pathways

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: validate-preferred-donor-pathways
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: donor-routing-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preferred-donor-pathways
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile
      - name: Apply implementation and regenerate clients
        run: |
          python .agent/apply-preferred-donor-schema-api.py
          python .agent/apply-preferred-donor-ui-export-tests.py
          python .agent/fix-preferred-donor-openapi.py
          pnpm --filter @workspace/api-spec run codegen
      - name: Format touched source
        run: |
          pnpm exec prettier --write \
            lib/db/src/schema/donorRoutingPreferences.ts \
            lib/db/src/schema/people.ts \
            lib/db/src/schema/donorPaymentIntermediaries.ts \
            lib/db/src/schema/index.ts \
            artifacts/api-server/src/lib/donorRouting.ts \
            artifacts/api-server/src/routes/donorRouting.ts \
            artifacts/api-server/src/routes/peopleEntityRoles.ts \
            artifacts/api-server/src/routes/index.ts \
            artifacts/api-server/src/__tests__/donor-routing.integration.test.ts \
            artifacts/wildflower-crm/src/components/preferred-donor-card.tsx \
            artifacts/wildflower-crm/src/pages/individual-detail.tsx \
            artifacts/wildflower-crm/src/pages/household-detail.tsx \
            artifacts/wildflower-crm/src/pages/funding-entity-detail.tsx \
            scripts/src/export-donor-attribution.ts \
            scripts/package.json
      - name: Build schema and validate migration
        run: |
          pnpm --filter @workspace/db run push-force
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0221_preferred_donor_pathways.sql
          pnpm run check:codegen
      - name: Typecheck and test
        run: |
          pnpm run check:api
          pnpm run check:web
          pnpm --filter @workspace/scripts run typecheck
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/donor-routing.integration.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/people-org-soft-credit.integration.test.ts
      - name: Commit validated implementation
        run: |
          rm -rf .agent
          rm -f .github/workflows/validate-preferred-donor-pathways.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add preferred donor pathways"
          git push origin HEAD:agent/preferred-donor-pathways
