name: Normalize deposit card cleanup diff

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: normalize-deposit-card-cleanup
  cancel-in-progress: true

jobs:
  normalize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: reconciliation-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-deposit-card-grain-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Rebuild semantic changes on main formatting
        run: |
          git fetch origin main
          git show 6d848527edebf2273e91e8fba3fb214e888af9c6:.agent/apply-deposit-card-grain.py > /tmp/apply-deposit-card-grain.py
          git show 4e4b374949c61ce608d2a42c93218881a12d087b:.agent/fix-deposit-card-types.py > /tmp/fix-deposit-card-types.py
          git checkout origin/main -- \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx \
            artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts \
            artifacts/api-server/src/__tests__/workbench-deposits.integration.test.ts
          python /tmp/apply-deposit-card-grain.py
          python /tmp/fix-deposit-card-types.py
          git diff --check

      - name: Build schema and typecheck
        run: |
          pnpm --filter @workspace/db run push-force
          pnpm run check:api
          pnpm run check:web

      - name: Run focused tests
        run: |
          pnpm --filter @workspace/wildflower-crm exec vitest run \
            src/components/reconciliation-deposits/presentation.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/routes/reconciliation/workbenchDepositState.test.ts \
            src/__tests__/workbench-deposits.integration.test.ts

      - name: Commit normalized implementation
        run: |
          rm .github/workflows/normalize-deposit-card-diff.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize deposit card cleanup diff"
          git push origin HEAD:agent/clean-deposit-card-grain-v3
