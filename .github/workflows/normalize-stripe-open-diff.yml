name: Normalize Stripe completion fix diff

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: normalize-stripe-open-fix
  cancel-in-progress: true

jobs:
  normalize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: reconciliation-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stripe-open-and-gift-duplicates
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Rebuild frontend changes on main formatting
        run: |
          ROWS=artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx
          PAGE=artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx

          git diff --ignore-all-space origin/main -- "$ROWS" > /tmp/rows-semantic.patch
          test -s /tmp/rows-semantic.patch
          git checkout origin/main -- "$ROWS" "$PAGE"
          git apply --3way /tmp/rows-semantic.patch

          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx')
          text = path.read_text()
          old = 'No reconciliation actions recorded yet.'
          new = 'No reversible reconciliation actions recorded yet.'
          if old not in text:
              raise SystemExit('recent changes empty-state text not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build schema and typecheck
        run: |
          pnpm --filter @workspace/db run push-force
          pnpm run check:api
          pnpm run check:web

      - name: Run focused tests
        run: |
          pnpm --filter @workspace/wildflower-crm exec vitest run \
            src/components/reconciliation-deposits/presentation.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/routes/reconciliation/workbenchDepositState.test.ts \
            src/__tests__/workbench-deposits.integration.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/workbench-recent-changes.integration.test.ts

      - name: Commit normalized implementation
        run: |
          rm -f .github/workflows/normalize-stripe-open-diff.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Stripe completion fix diff"
          git push origin HEAD:agent/fix-stripe-open-and-gift-duplicates
