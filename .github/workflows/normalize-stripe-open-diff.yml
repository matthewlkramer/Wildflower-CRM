name: Normalize Stripe completion fix diff

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: normalize-stripe-open-fix
  cancel-in-progress: true

jobs:
  normalize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: reconciliation-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stripe-open-and-gift-duplicates
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Rebuild frontend changes on main formatting
        run: |
          ROWS=artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx
          PAGE=artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx
          git checkout origin/main -- "$ROWS" "$PAGE"

          python - <<'PY'
          from pathlib import Path

          rows_path = Path('artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx')
          rows = rows_path.read_text()

          qb_preview_start = rows.index('function qbPreview(')
          deposit_row_start = rows.index('export function DepositRow', qb_preview_start)
          rows = rows[:qb_preview_start] + rows[deposit_row_start:]

          segment_start = rows.index('  const linkedStagedPaymentIds =')
          segment_end = rows.index('  const giftAnchor =', segment_start)
          replacement = '''  const giftColumnAnchor: AnchorRef | null = (() => {
            const charge = deposit.charges.find((item) => !item.linkedGiftId);
            if (charge) {
              return {
                kind: "charge",
                id: charge.chargeId,
                label: charge.payerName ?? charge.chargeId,
              };
            }
            const component =
              deposit.composition.kind === "components"
                ? deposit.composition.components.find(
                    (item) =>
                      (item.countedGiftIds?.length ?? 0) === 0 &&
                      Boolean(item.stagedPaymentId),
                  )
                : undefined;
            if (component?.stagedPaymentId) {
              return {
                kind: "staged",
                id: component.stagedPaymentId,
                label: component.label ?? component.kind,
              };
            }
            return null;
          })();
          const bankPreview: EvidencePreview = {
            amount: money(deposit.bank.amount),
            date: deposit.date ? formatDateShort(deposit.date) : "—",
            method: "Bank deposit",
            source: deposit.bank.memo ?? deposit.bank.reference ?? deposit.anchorId,
            memo: deposit.bank.memo ?? null,
          };
          const unlinkedCharges = deposit.charges.filter(
            (charge) => !charge.linkedGiftId,
          );
          const unlinkedComponents =
            deposit.composition.kind === "components"
              ? deposit.composition.components.filter(
                  (component) =>
                    component.source === "bank_spine" &&
                    (component.countedGiftIds?.length ?? 0) === 0 &&
                    component.stagedPaymentId,
                )
              : [];
          const hasGiftColumnCards =
            deposit.gifts.length > 0 ||
            unlinkedCharges.length > 0 ||
            unlinkedComponents.length > 0;
          '''
          rows = rows[:segment_start] + replacement + rows[segment_end:]

          qb_cards_start = rows.find('          {unlinkedQbRecords.map((record) => {')
          if qb_cards_start < 0:
              raise SystemExit('unlinked QBO gift-card block not found')
          components_start = rows.find(
              '          {unlinkedComponents.map((component) => {',
              qb_cards_start,
          )
          if components_start < 0:
              raise SystemExit('unlinked component block not found')
          rows = rows[:qb_cards_start] + rows[components_start:]
          rows_path.write_text(rows)

          page_path = Path('artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx')
          page = page_path.read_text()
          old = 'No reconciliation actions recorded yet.'
          new = 'No reversible reconciliation actions recorded yet.'
          if old not in page:
              raise SystemExit('recent changes empty-state text not found')
          page_path.write_text(page.replace(old, new, 1))
          PY

      - name: Build schema and typecheck
        run: |
          pnpm --filter @workspace/db run push-force
          pnpm run check:api
          pnpm run check:web

      - name: Run focused tests
        run: |
          pnpm --filter @workspace/wildflower-crm exec vitest run \
            src/components/reconciliation-deposits/presentation.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/routes/reconciliation/workbenchDepositState.test.ts \
            src/__tests__/workbench-deposits.integration.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/workbench-recent-changes.integration.test.ts

      - name: Commit normalized implementation
        run: |
          rm -f .github/workflows/normalize-stripe-open-diff.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Stripe completion fix diff"
          git push origin HEAD:agent/fix-stripe-open-and-gift-duplicates
