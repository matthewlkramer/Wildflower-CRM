name: Validate donor export compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: validate-donor-export-compat
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preferred-donor-pathways
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile
      - name: Typecheck export
        run: pnpm --filter @workspace/scripts run typecheck
      - name: Run export after pathway schema
        run: |
          pnpm --filter @workspace/db run push-force
          DONOR_ATTRIBUTION_EXPORT_PATH=/tmp/donor-after.json.gz \
            pnpm --filter @workspace/scripts run export:donor-attribution
          test -s /tmp/donor-after.json.gz
          gzip -t /tmp/donor-after.json.gz
      - name: Run export before pathway migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE donor_routing_preferences;
          ALTER TABLE donor_payment_intermediaries DROP COLUMN is_default;
          ALTER TABLE people DROP COLUMN primary_household_id;
          SQL
          DONOR_ATTRIBUTION_EXPORT_PATH=/tmp/donor-before.json.gz \
            pnpm --filter @workspace/scripts run export:donor-attribution
          test -s /tmp/donor-before.json.gz
          gzip -t /tmp/donor-before.json.gz
          node -e "const fs=require('fs');const z=require('zlib');const x=JSON.parse(z.gunzipSync(fs.readFileSync('/tmp/donor-before.json.gz')));if(x.metadata.pathwaySchemaPresent!==false)process.exit(1)"
      - name: Commit validated export
        run: |
          rm -f .github/workflows/validate-donor-export-compat.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make donor export migration-compatible"
          git push origin HEAD:agent/preferred-donor-pathways
