name: Refine workbench usability

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: refine-workbench-usability-pr
  cancel-in-progress: true

jobs:
  refine-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: reconciliation-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workbench-alignment-search-undo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Apply safety and coverage refinements
        run: python .agent/refine-workbench-usability.py

      - name: Capture normalization reject
        run: |
          set +e
          ROWS=artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx
          PAGE=artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx
          git diff --ignore-all-space origin/main -- "$ROWS" > /tmp/rows-semantic.patch
          git diff --ignore-all-space origin/main -- "$PAGE" > /tmp/page-semantic.patch
          git checkout origin/main -- "$ROWS" "$PAGE"
          git apply --reject --whitespace=nowarn /tmp/rows-semantic.patch
          ROWS_STATUS=$?
          git apply --reject --whitespace=nowarn /tmp/page-semantic.patch
          PAGE_STATUS=$?
          set -e
          if [ "$ROWS_STATUS" -ne 0 ] || [ "$PAGE_STATUS" -ne 0 ]; then
            mkdir -p .agent/normalization-rejects
            find artifacts/wildflower-crm/src -name '*.rej' -exec cp --parents {} .agent/normalization-rejects/ \;
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .agent/normalization-rejects
            git commit -m "Record workbench normalization reject"
            git push origin HEAD:agent/workbench-alignment-search-undo
            exit 1
          fi

      - name: Format backend and tests
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/routes/reconciliation/recentChanges.ts \
            artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts \
            artifacts/api-server/src/__tests__/workbench-deposits.integration.test.ts \
            artifacts/api-server/src/__tests__/workbench-recent-changes.integration.test.ts \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/presentation.test.ts

      - name: Build schema and typecheck
        run: |
          pnpm --filter @workspace/db run push-force
          pnpm run check:api
          pnpm run check:web

      - name: Run focused tests
        run: |
          pnpm --filter @workspace/wildflower-crm exec vitest run \
            src/components/reconciliation-deposits/presentation.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/routes/reconciliation/workbenchDepositState.test.ts \
            src/__tests__/workbench-deposits.integration.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/workbench-recent-changes.integration.test.ts

      - name: Commit normalized implementation
        run: |
          rm -rf .agent
          rm -f .github/workflows/refine-workbench-usability.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine workbench unlink and candidate handling"
          git push origin HEAD:agent/workbench-alignment-search-undo
