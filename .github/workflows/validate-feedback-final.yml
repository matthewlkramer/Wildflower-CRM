name: Validate final feedback workflow

on:
  push:
    branches:
      - agent/app-feedback-workflow-v2
    paths-ignore:
      - .feedback-validation-error.txt

permissions:
  contents: write

concurrency:
  group: validate-feedback-final
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: feedback-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-feedback-workflow-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and commit
        run: |
          npm install --global pnpm@10
          set +e
          {
            pnpm install --frozen-lockfile
            python .agent/fix-feedback-search.py
            pnpm exec prettier --write \
              artifacts/api-server/src/routes/appFeedback.ts \
              artifacts/api-server/src/__tests__/app-feedback.integration.test.ts
            pnpm --filter @workspace/db run push-force
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0219_app_feedback.sql
            pnpm run check:api
            pnpm run check:web
            pnpm --filter @workspace/api-server exec vitest run \
              src/__tests__/app-feedback.integration.test.ts
            pnpm --filter @workspace/wildflower-crm exec vitest run \
              src/lib/feedback-capture.test.ts
          } > /tmp/feedback-final-validation.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            tail -n 600 /tmp/feedback-final-validation.log > .feedback-validation-error.txt
            git add .feedback-validation-error.txt
            git commit -m "Record final feedback validation failure"
            git push origin HEAD:agent/app-feedback-workflow-v2
            cat /tmp/feedback-final-validation.log
            exit "$status"
          fi

          rm -rf .agent
          rm -f .github/workflows/validate-feedback-final.yml
          rm -f .feedback-validation-error.txt
          rmdir .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Harden app feedback search"
          git push origin HEAD:agent/app-feedback-workflow-v2
          cat /tmp/feedback-final-validation.log
