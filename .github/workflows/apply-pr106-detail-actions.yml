name: Apply and validate PR 106 detail actions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr106-detail-actions
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_detail_actions_pr106
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_detail_actions_pr106"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_detail_actions_pr106
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: detail-actions-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
      OVERLAY_URL: https://filebin.net/wf-detail-actions-20260801-final-v3-c6d2/detail-actions-overlay-v3.tar.gz
      OVERLAY_SHA256: 37011ad4545d055719d8752ed770ab64a4210a886020b8429e874645cbbafb06
      TARGET_BRANCH: agent/detail-action-lifecycle-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Check whether implementation is already present
        id: implementation
        shell: bash
        run: |
          if [ -f artifacts/api-server/src/routes/fundraisingRecordActions.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.implementation.outputs.present != 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.implementation.outputs.present != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Download and apply reviewed implementation overlay
        if: steps.implementation.outputs.present != 'true'
        shell: bash
        run: |
          curl --fail --location --silent --show-error "$OVERLAY_URL" -o /tmp/detail-actions-overlay.tar.gz
          echo "$OVERLAY_SHA256  /tmp/detail-actions-overlay.tar.gz" | sha256sum --check -
          tar -xzf /tmp/detail-actions-overlay.tar.gz
          rm -f \
            .github/workflows/apply-detail-actions-v2.yml \
            .github/workflows/validate-detail-actions-implementation.yml \
            detail-actions-trigger.txt

      - name: Assert required action model
        if: steps.implementation.outputs.present != 'true'
        shell: bash
        run: |
          test -f artifacts/api-server/src/routes/fundraisingRecordActions.ts
          test -f artifacts/api-server/src/__tests__/fundraising-record-actions.integration.test.ts
          test -f artifacts/wildflower-crm/src/components/payment-evidence-picker-dialog.tsx
          test -f artifacts/wildflower-crm/src/components/record-received-gift-dialog.tsx
          test -f artifacts/wildflower-crm/src/components/pending-gift-dialog.tsx
          grep -q "convert-pledge-to-standalone-gift" artifacts/api-server/src/routes/fundraisingRecordActions.ts
          grep -q "rewrittenAsOriginallyStandaloneGift" artifacts/api-server/src/routes/fundraisingRecordActions.ts
          grep -q "Record pending gift" artifacts/wildflower-crm/src/components/pending-gift-dialog.tsx
          grep -q "Link reimbursement payment" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx
          grep -q "Split into pledge" artifacts/wildflower-crm/src/pages/gift-detail.tsx
          grep -q "revert-pledge" artifacts/api-server/src/routes/fundraisingRecordActions.ts
          ! grep -q "Record payment (via reconciliation workbench)" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx
          ! grep -Eq "navigate\(['\"]\/reconciliation|href=['\"]\/reconciliation" \
            artifacts/wildflower-crm/src/pages/opportunity-detail.tsx \
            artifacts/wildflower-crm/src/components/payment-evidence-picker-dialog.tsx \
            artifacts/wildflower-crm/src/components/record-received-gift-dialog.tsx \
            artifacts/wildflower-crm/src/components/pending-gift-dialog.tsx

      - run: pnpm install --frozen-lockfile
        if: steps.implementation.outputs.present != 'true'

      - name: Establish disposable schema
        if: steps.implementation.outputs.present != 'true'
        run: pnpm --filter @workspace/db run push-force

      - name: Generate API clients
        if: steps.implementation.outputs.present != 'true'
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Typecheck API and web
        if: steps.implementation.outputs.present != 'true'
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/wildflower-crm run typecheck

      - name: Run focused database-backed tests
        if: steps.implementation.outputs.present != 'true'
        shell: bash
        run: |
          files=()
          for file in \
            src/__tests__/fundraising-record-actions.integration.test.ts \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/donor-attribution-phase3.integration.test.ts \
            src/__tests__/opportunity-commitment-lifecycle.integration.test.ts \
            src/__tests__/pledge-payment-lifecycle.integration.test.ts; do
            [ -f "artifacts/api-server/$file" ] && files+=("$file")
          done
          pnpm --filter @workspace/api-server exec vitest run "${files[@]}" --reporter=verbose

      - name: Format and revalidate
        if: steps.implementation.outputs.present != 'true'
        shell: bash
        run: |
          changed=$(git status --short | awk '{print $2}' | grep -E '\.(ts|tsx|js|jsx|json|ya?ml|md)$' || true)
          if [ -n "$changed" ]; then
            pnpm exec prettier --write $changed
            pnpm exec prettier --check $changed
          fi
          pnpm --filter @workspace/api-spec run codegen:check
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/wildflower-crm run typecheck
          git diff --check

      - name: Commit implementation
        if: steps.implementation.outputs.present != 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement record-local donor and fundraising actions"
          git push origin HEAD:$TARGET_BRANCH
