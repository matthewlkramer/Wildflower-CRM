name: Apply and validate detail actions v2

on:
  push:
    branches: [agent/detail-action-lifecycle-v2]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_detail_actions_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_detail_actions_v2"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_detail_actions_v2
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: detail-actions-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
      OVERLAY_URL: https://filebin.net/wf-detail-actions-20260801-final-v3-c6d2/detail-actions-overlay-v3.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/detail-action-lifecycle-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply reviewed implementation overlay
        run: |
          curl --fail --location --silent --show-error "$OVERLAY_URL" -o /tmp/detail-actions-overlay.tar.gz
          tar -xzf /tmp/detail-actions-overlay.tar.gz

      - name: Assert required action model
        run: |
          test -f artifacts/api-server/src/routes/detailActions.ts
          test -f artifacts/api-server/src/__tests__/detail-actions.integration.test.ts
          test -f artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx
          test -f artifacts/wildflower-crm/src/components/donor-fundraising-actions.tsx
          grep -q "convert-pledge-to-standalone-gift" artifacts/api-server/src/routes/detailActions.ts
          grep -q "rewrittenAsOriginallyStandaloneGift" artifacts/api-server/src/routes/detailActions.ts
          grep -q "Record pending gift" artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx
          grep -q "Link reimbursement payment" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx
          grep -q "Split into pledge" artifacts/wildflower-crm/src/pages/gift-detail.tsx
          grep -q "revert-pledge" artifacts/api-server/src/routes/detailActions.ts
          ! grep -q "Record payment (via reconciliation workbench)" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx
          ! grep -Eq "navigate\(['\"]\/reconciliation|href=['\"]\/reconciliation" \
            artifacts/wildflower-crm/src/pages/opportunity-detail.tsx \
            artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx \
            artifacts/wildflower-crm/src/components/donor-fundraising-actions.tsx

      - run: pnpm install --frozen-lockfile

      - name: Establish disposable schema
        run: pnpm --filter @workspace/db run push-force

      - name: Generate API clients
        run: |
          pnpm run check:api
          pnpm run check:codegen

      - name: Typecheck API and web
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/wildflower-crm typecheck

      - name: Run focused database-backed tests
        shell: bash
        run: |
          files=()
          for file in \
            src/__tests__/detail-actions.integration.test.ts \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/donor-attribution-phase3.integration.test.ts \
            src/__tests__/opportunity-commitment-lifecycle.integration.test.ts \
            src/__tests__/pledge-payment-lifecycle.integration.test.ts; do
            [ -f "artifacts/api-server/$file" ] && files+=("$file")
          done
          pnpm --filter @workspace/api-server exec vitest run "${files[@]}" --reporter=verbose

      - name: Format and revalidate
        shell: bash
        run: |
          changed=$(git status --short | awk '{print $2}' | grep -E '\.(ts|tsx|js|jsx|json|ya?ml|md)$' || true)
          if [ -n "$changed" ]; then
            pnpm exec prettier --write $changed
            pnpm exec prettier --check $changed
          fi
          pnpm run check:codegen
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/wildflower-crm typecheck
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts lib docs scripts package.json pnpm-lock.yaml 2>/dev/null || true
          git commit -m "Implement record-local donor and fundraising actions"
          git push origin HEAD:agent/detail-action-lifecycle-v2
