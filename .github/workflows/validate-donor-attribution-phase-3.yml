name: Validate donor attribution phase 3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.head_ref == 'agent/donor-attribution-phase-3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_phase3
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_phase3"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_phase3
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: phase3-test-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-attribution-phase-3
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Establish Phase 2 schema
        run: pnpm --filter @workspace/db run push-force

      - name: Apply phase 3 source patch
        run: |
          cat .github/scripts/apply_donor_attribution_phase3.py.gz.b64.part* > /tmp/phase3.b64
          base64 -d /tmp/phase3.b64 | gzip -d > /tmp/apply_donor_attribution_phase3.py
          python /tmp/apply_donor_attribution_phase3.py
          python - <<'PY'
          from pathlib import Path
          import re

          spec = Path('lib/api-spec/openapi.yaml')
          text = spec.read_text()
          text = text.replace(
              '"409": { description: Proposal is stale, unavailable, or no longer open. }',
              '"409": { description: "Proposal is stale, unavailable, or no longer open." }',
          )
          text = text.replace(
              'items: { $ref: "#/components/schemas/HouseholdMember" }',
              'items: { $ref: "#/components/schemas/PeopleEntityRole" }',
          )
          text = re.sub(
              r'(?ms)^    HouseholdMember:\n.*?(?=^    HouseholdDetail:\n)',
              '',
              text,
          )
          spec.write_text(text)

          migration = Path('lib/db/migrations/0223_donor_attribution_phase_3.sql')
          sql = migration.read_text().strip()
          if not sql.startswith('BEGIN;'):
              sql = 'BEGIN;\n\n' + sql
          if not sql.endswith('COMMIT;'):
              sql = sql + '\n\nCOMMIT;'
          migration.write_text(sql + '\n')

          cleanup_route = Path('artifacts/api-server/src/routes/cleanupQueue.ts')
          source = cleanup_route.read_text()
          source = source.replace(
              'const userNameSql = (column: typeof cleanupQueue.flaggedByUserId) =>',
              'const userNameSql = (column: typeof cleanupQueue.flaggedByUserId | typeof cleanupQueue.resolvedByUserId) =>',
          )
          cleanup_route.write_text(source)

          household_route = Path('artifacts/api-server/src/routes/households.ts')
          source = household_route.read_text()
          replacement = '''const householdMemberSelect = {
            id: sql<string>`'primary_household:' || ${people.id}`.as("id"),
            personId: people.id,
            entityType: sql<"household">`'household'`.as("entity_type"),
            organizationId: sql<string | null>`NULL::text`.as("organization_id"),
            paymentIntermediaryId: sql<string | null>`NULL::text`.as(
              "payment_intermediary_id",
            ),
            householdId: people.primaryHouseholdId,
            connection: sql<string | null>`NULL::text`.as("connection"),
            notes: sql<string | null>`NULL::text`.as("notes"),
            externalTitleOrRole: sql<string | null>`NULL::text`.as(
              "external_title_or_role",
            ),
            current: sql<"current">`'current'`.as("current"),
            primaryContact: sql<boolean>`false`.as("primary_contact"),
            createdAt: people.createdAt,
            updatedAt: people.updatedAt,
            personName: personDisplayNameSql(people).as("person_name"),
            personEmail: sql<string | null>`(
              SELECT e.email FROM emails e
              WHERE e.person_id = ${people.id}
              ORDER BY e.is_preferred DESC, e.created_at ASC
              LIMIT 1
            )`.as("person_email"),
            personAnonymous: people.anonymous,
            personOwnerUserId: people.ownerUserId,
          };'''
          source, count = re.subn(
              r'(?ms)^const householdMemberSelect = \{.*?^\};',
              replacement,
              source,
              count=1,
          )
          if count != 1:
              raise RuntimeError('household member projection not found')
          household_route.write_text(source)
          PY

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            lib/db/src/schema/cleanupQueue.ts \
            lib/db/src/schema/peopleEntityRoles.ts \
            artifacts/api-server/src/routes/donorRouting.ts \
            artifacts/api-server/src/routes/households.ts \
            artifacts/api-server/src/routes/peopleEntityRoles.ts \
            artifacts/api-server/src/routes/cleanupQueue.ts \
            artifacts/api-server/src/__tests__/donor-attribution-phase3.integration.test.ts \
            artifacts/wildflower-crm/src/pages/cleanup-queue.tsx \
            artifacts/wildflower-crm/src/pages/household-detail.tsx \
            docs/donor-attribution-phase-3.md

      - name: Rehearse Phase 3 migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0223_donor_attribution_phase_3.sql

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web
      - name: Run focused integration tests
        run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/donor-attribution-phase3.integration.test.ts

      - name: Remove temporary validation machinery
        run: |
          rm -f .github/workflows/validate-donor-attribution-phase-3.yml
          rm -f .github/scripts/apply_donor_attribution_phase3.py.gz.b64.part*

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement donor attribution phase 3"
          git push origin HEAD:agent/donor-attribution-phase-3
