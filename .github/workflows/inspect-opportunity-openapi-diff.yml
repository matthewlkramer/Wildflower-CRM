name: Finalize opportunity lifecycle OpenAPI diff

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/opportunity-commitment-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_openapi_cleanup
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_openapi_cleanup"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_openapi_cleanup
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: opportunity-lifecycle-cleanup-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-commitment-lifecycle
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rebuild OpenAPI with localized text edits
        shell: bash
        run: |
          cat > /tmp/patch-opportunity-openapi.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const { isDeepStrictEqual } = require('util');

          const yamlPackage = execFileSync(
            'bash',
            ['-lc', "find node_modules/.pnpm -path '*/node_modules/yaml/package.json' | head -n 1"],
            { encoding: 'utf8' },
          ).trim();
          if (!yamlPackage) throw new Error('Could not locate yaml package');
          const YAML = require(path.resolve(path.dirname(yamlPackage)));

          const target = 'lib/api-spec/openapi.yaml';
          const currentText = fs.readFileSync(target, 'utf8');
          const expected = YAML.parse(currentText);
          const baseText = execFileSync(
            'git',
            ['show', `origin/main:${target}`],
            { encoding: 'utf8', maxBuffer: 50 * 1024 * 1024 },
          ).replace(/\r\n/g, '\n');

          let lines = baseText.split('\n');
          if (lines.at(-1) === '') lines.pop();

          const indentOf = (line) => line.match(/^ */)[0].length;
          const isBlank = (line) => line.trim() === '';
          const isComment = (line) => line.trimStart().startsWith('#');
          const keyMatches = (line, indent, key) => {
            if (indentOf(line) !== indent) return false;
            const rest = line.slice(indent);
            return rest === `${key}:` || rest.startsWith(`${key}: `);
          };

          function nodeEnd(index, indent, limit) {
            for (let cursor = index + 1; cursor < limit; cursor += 1) {
              if (isBlank(lines[cursor])) continue;
              if (indentOf(lines[cursor]) <= indent) return cursor;
            }
            return limit;
          }

          function findNode(parts) {
            let start = 0;
            let end = lines.length;
            let indent = 0;
            for (let depth = 0; depth < parts.length; depth += 1) {
              const key = parts[depth];
              let index = -1;
              for (let cursor = start; cursor < end; cursor += 1) {
                if (keyMatches(lines[cursor], indent, key)) {
                  index = cursor;
                  break;
                }
              }
              if (index < 0) {
                throw new Error(`Could not find YAML path ${parts.join('.')}`);
              }
              const next = nodeEnd(index, indent, end);
              if (depth === parts.length - 1) {
                return { index, end: next, indent, parentStart: start, parentEnd: end };
              }
              start = index + 1;
              end = next;
              indent += 2;
            }
            throw new Error(`Invalid YAML path ${parts.join('.')}`);
          }

          function get(object, parts) {
            return parts.reduce((value, part) => {
              if (
                value == null ||
                !Object.prototype.hasOwnProperty.call(value, part)
              ) {
                return undefined;
              }
              return value[part];
            }, object);
          }

          function renderEntry(key, value, indent) {
            return YAML.stringify({ [key]: value }, { lineWidth: 0 })
              .trimEnd()
              .split('\n')
              .map((line) => `${' '.repeat(indent)}${line}`);
          }

          function leadingCommentStart(node) {
            let start = node.index;
            while (start > node.parentStart) {
              const previous = lines[start - 1];
              if (!isComment(previous) || indentOf(previous) !== node.indent) break;
              start -= 1;
            }
            return start;
          }

          function replaceNode(parts, value, options = {}) {
            const node = findNode(parts);
            const start = options.removeLeadingComments
              ? leadingCommentStart(node)
              : node.index;
            lines.splice(
              start,
              node.end - start,
              ...renderEntry(parts.at(-1), value, node.indent),
            );
          }

          function deleteNode(parts, options = {}) {
            const node = findNode(parts);
            const start = options.removeLeadingComments
              ? leadingCommentStart(node)
              : node.index;
            lines.splice(start, node.end - start);
          }

          function insertBefore(parentParts, beforeKey, key, value) {
            const parent = findNode(parentParts);
            const childIndent = parent.indent + 2;
            let index = -1;
            for (let cursor = parent.index + 1; cursor < parent.end; cursor += 1) {
              if (keyMatches(lines[cursor], childIndent, beforeKey)) {
                index = cursor;
                break;
              }
            }
            if (index < 0) {
              throw new Error(
                `Could not insert ${key} before ${[...parentParts, beforeKey].join('.')}`,
              );
            }
            lines.splice(index, 0, ...renderEntry(key, value, childIndent));
          }

          function insertAtEnd(parentParts, key, value) {
            const parent = findNode(parentParts);
            lines.splice(
              parent.end,
              0,
              ...renderEntry(key, value, parent.indent + 2),
            );
          }

          const schemaPath = (...parts) => ['components', 'schemas', ...parts];

          // Replace the few existing lifecycle nodes whose semantics changed.
          for (const parts of [
            schemaPath('OpportunityStage'),
            schemaPath('OpportunityStatus'),
            schemaPath('ReconciliationOutcome'),
            schemaPath(
              'RevertGiftToOpportunityBody',
              'properties',
              'asPledge',
            ),
          ]) {
            const value = get(expected, parts);
            if (value === undefined) throw new Error(`Missing expected ${parts.join('.')}`);
            replaceNode(parts, value);
          }

          const writtenPledgePath = schemaPath(
            'OpportunityOrPledge',
            'properties',
            'writtenPledge',
          );
          replaceNode(writtenPledgePath, get(expected, writtenPledgePath), {
            removeLeadingComments: true,
          });

          // Remove all remaining writable surfaces for the compatibility mirror.
          for (const parts of [
            schemaPath(
              'CreateOpportunityOrPledgeBody',
              'properties',
              'writtenPledge',
            ),
            schemaPath(
              'UpdateOpportunityOrPledgeBody',
              'properties',
              'writtenPledge',
            ),
            schemaPath(
              'BulkUpdateOpportunitiesPatch',
              'properties',
              'writtenPledge',
            ),
          ]) {
            deleteNode(parts);
          }

          // Add the explicit lifecycle fields to opportunity responses.
          const opportunityProperties = schemaPath(
            'OpportunityOrPledge',
            'properties',
          );
          for (const key of [
            'commitmentPath',
            'verbalCommitmentAt',
            'pledgeCommittedAt',
            'outcomeType',
          ]) {
            insertBefore(
              opportunityProperties,
              'writtenPledge',
              key,
              get(expected, [...opportunityProperties, key]),
            );
          }

          // Add focused request/response schemas without reformatting the contract.
          const schemas = ['components', 'schemas'];
          for (const key of [
            'OpportunityCommitmentPath',
            'OpportunityOutcomeType',
            'RecordVerbalCommitmentBody',
            'FinalizePledgeBody',
            'OpportunityCommitmentResult',
          ]) {
            insertBefore(
              schemas,
              'OpportunityOrPledge',
              key,
              get(expected, [...schemas, key]),
            );
          }

          // Add the two guided lifecycle transitions at the end of the paths map.
          for (const key of [
            '/opportunities-and-pledges/{id}/record-verbal-commitment',
            '/opportunities-and-pledges/{id}/finalize-pledge',
          ]) {
            insertAtEnd(['paths'], key, get(expected, ['paths', key]));
          }

          const patchedText = `${lines.join('\n')}\n`;
          const patched = YAML.parse(patchedText);
          if (!isDeepStrictEqual(patched, expected)) {
            const differences = [];
            const walk = (before, after, parts) => {
              if (isDeepStrictEqual(before, after)) return;
              const beforeObject = before !== null && typeof before === 'object';
              const afterObject = after !== null && typeof after === 'object';
              if (
                !beforeObject ||
                !afterObject ||
                Array.isArray(before) ||
                Array.isArray(after)
              ) {
                differences.push(parts.join('.'));
                return;
              }
              const keys = new Set([
                ...Object.keys(before),
                ...Object.keys(after),
              ]);
              for (const key of keys) walk(before[key], after[key], [...parts, key]);
            };
            walk(expected, patched, []);
            throw new Error(
              `Localized OpenAPI patch changed semantics at: ${differences
                .slice(0, 40)
                .join(', ')}`,
            );
          }

          fs.writeFileSync(target, patchedText);
          NODE
          node /tmp/patch-opportunity-openapi.cjs

      - name: Require a focused OpenAPI diff
        shell: bash
        run: |
          stats=$(git diff --numstat origin/main -- lib/api-spec/openapi.yaml)
          echo "$stats"
          read -r additions deletions _ <<< "$stats"
          test -n "$additions"
          test "$additions" != "-"
          test "$deletions" != "-"
          total=$((additions + deletions))
          echo "OpenAPI changed lines: $total"
          if [ "$total" -gt 1000 ]; then
            echo "OpenAPI patch still contains excessive formatting churn." >&2
            exit 1
          fi

      - name: Establish schema and rehearse migration 0224
        run: |
          pnpm --filter @workspace/db run push-force
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0224_opportunity_commitment_lifecycle.sql

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web

      - name: Run focused lifecycle and correction tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/derive-opp-fields.test.ts \
            src/__tests__/create-gift-overrides.integration.test.ts \
            src/__tests__/reconciliation-approve.integration.test.ts \
            src/__tests__/audit-close-resolution.integration.test.ts \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/opportunity-commitment-reconstruction.integration.test.ts

      - name: Verify final diff and remove cleanup workflow
        shell: bash
        run: |
          git diff --check
          rm -f .github/workflows/inspect-opportunity-openapi-diff.yml

      - name: Commit cleaned validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize opportunity lifecycle API contract"
          git push origin HEAD:agent/opportunity-commitment-lifecycle
