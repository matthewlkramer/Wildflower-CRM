name: Commit validated opportunity lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/opportunity-commitment-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_lifecycle_final
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_lifecycle_final"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_lifecycle_final
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: opportunity-lifecycle-final-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-commitment-lifecycle
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply the already-validated localized OpenAPI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/inspect-opportunity-openapi-diff.yml')
          source = workflow.read_text().splitlines()
          start = next(
              index
              for index, line in enumerate(source)
              if "cat > /tmp/patch-opportunity-openapi.cjs <<'NODE'" in line
          ) + 1
          end = next(
              index
              for index in range(start, len(source))
              if source[index].strip() == 'NODE'
          )
          script_lines = []
          for line in source[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/patch-opportunity-openapi.cjs').write_text(
              '\n'.join(script_lines) + '\n'
          )
          PY
          node /tmp/patch-opportunity-openapi.cjs
          stats=$(git diff --numstat origin/main -- lib/api-spec/openapi.yaml)
          echo "$stats"
          read -r additions deletions _ <<< "$stats"
          total=$((additions + deletions))
          test "$total" -le 1000

      - name: Rehearse migration and regenerate clients
        run: |
          pnpm --filter @workspace/db run push-force
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0224_opportunity_commitment_lifecycle.sql
          pnpm --filter @workspace/api-spec run codegen

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web

      - name: Run focused lifecycle and correction tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/derive-opp-fields.test.ts \
            src/__tests__/create-gift-overrides.integration.test.ts \
            src/__tests__/reconciliation-approve.integration.test.ts \
            src/__tests__/audit-close-resolution.integration.test.ts \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/opportunity-commitment-reconstruction.integration.test.ts

      - name: Verify source diff and remove temporary workflows
        shell: bash
        run: |
          git diff --check -- . \
            ':(exclude)lib/api-client-react/src/generated/**' \
            ':(exclude)lib/api-zod/src/generated/**'
          rm -f .github/workflows/inspect-opportunity-openapi-diff.yml
          rm -f .github/workflows/finalize-opportunity-lifecycle.yml

      - name: Commit the validated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize opportunity commitment lifecycle"
          git push origin HEAD:agent/opportunity-commitment-lifecycle
