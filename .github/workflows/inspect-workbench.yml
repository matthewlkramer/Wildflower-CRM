name: Inspect workbench implementation

on:
  push:
    branches:
      - agent/workbench-alignment-search-undo

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workbench-alignment-search-undo
      - name: Inspect relevant workbench code
        run: |
          set -euo pipefail
          ROWS=artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx
          PAGE=artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx
          RECENT=artifacts/api-server/src/routes/reconciliation/recentChanges.ts
          API=artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts
          echo '=== ROWS SYMBOLS ==='
          grep -nE 'DEPOSIT_GRID|function (Composition|Gifts|Gift|Accounting|NodeQbCard|DepositRow)|export function DepositGridHeader|CardActionsMenu' "$ROWS" || true
          echo '=== ROWS 1-220 ==='; sed -n '1,220p' "$ROWS"
          echo '=== ROWS 220-520 ==='; sed -n '220,520p' "$ROWS"
          echo '=== ROWS 520-900 ==='; sed -n '520,900p' "$ROWS"
          echo '=== PAGE SYMBOLS ==='
          grep -nEi 'unclaimed|near this remainder|openSinglePaymentDeposit|recent changes|recentChanges|payment unit|remainder|claimed' "$PAGE" || true
          echo '=== PAGE MATCH CONTEXT ==='
          for n in $(grep -nEi 'unclaimed|near this remainder|openSinglePaymentDeposit|recent changes|recentChanges|payment unit|remainder|claimed' "$PAGE" | cut -d: -f1 | head -40); do
            start=$((n>18?n-18:1)); end=$((n+36)); echo "--- $PAGE:$start-$end ---"; sed -n "${start},${end}p" "$PAGE";
          done
          echo '=== RECENT CHANGES ROUTE ==='; cat "$RECENT"
          echo '=== API SEARCH/UNLINK SYMBOLS ==='
          grep -nEi 'payment-unit|payment unit|candidate|search|bank-deposit-components|remove|unlink|retarget' "$API" | head -120 || true
