name: Validate app feedback workflow

on:
  push:
    branches:
      - agent/app-feedback-workflow-v2

permissions:
  contents: write

concurrency:
  group: validate-app-feedback-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: feedback-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-feedback-workflow-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Apply implementation
        run: |
          python .agent/apply-app-feedback.py
          python - <<'PY'
          from pathlib import Path

          route = Path('artifacts/api-server/src/routes/appFeedback.ts')
          text = route.read_text(encoding='utf-8')
          text = text.replace(
              'import { Router, type IRouter } from "express";',
              'import { Router, type IRouter, type Response } from "express";',
              1,
          )
          text = text.replace(
              'function parseOr400<T>(schema: z.ZodType<T>, value: unknown, res: Parameters<Parameters<typeof asyncHandler>[0]>[1]): T | null {',
              'function parseOr400<T>(schema: z.ZodType<T>, value: unknown, res: Response): T | null {',
              1,
          )
          text = text.replace(
              '''    const filters: SQL[] = [];
    if (query.status !== "all") filters.push(eq(appFeedback.status, query.status));
    if (query.category !== "all") {
      filters.push(eq(appFeedback.category, query.category));
    }
''',
              '''    const status = query.status ?? "open";
    const category = query.category ?? "all";
    const page = query.page ?? 1;
    const limit = query.limit ?? 50;
    const filters: SQL[] = [];
    if (status !== "all") filters.push(eq(appFeedback.status, status));
    if (category !== "all") {
      filters.push(eq(appFeedback.category, category));
    }
''',
              1,
          )
          text = text.replace(
              '    const offset = (query.page - 1) * query.limit;',
              '    const offset = (page - 1) * limit;',
              1,
          )
          text = text.replace('.limit(query.limit)', '.limit(limit)', 1)
          text = text.replace(
              '''        page: query.page,
        limit: query.limit,
''',
              '''        page,
        limit,
''',
              1,
          )
          route.write_text(text, encoding='utf-8')

          test = Path('artifacts/api-server/src/__tests__/app-feedback.integration.test.ts')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'currentUser: { id: REPORTER_ID, role: "team_member" as string },',
              'currentUser: { id: "", role: "team_member" as string },',
              1,
          )
          text = text.replace(
              '}));\n\nvi.mock("../middlewares/requireAuth"',
              '}));\ncurrentUser.id = REPORTER_ID;\n\nvi.mock("../middlewares/requireAuth"',
              1,
          )
          test.write_text(text, encoding='utf-8')

          layout = Path('artifacts/wildflower-crm/src/components/layout.tsx')
          text = layout.read_text(encoding='utf-8')
          text = text.replace(
              'const isActive = location === item.href || location.startsWith(`${item.href}/`);',
              'const isActive = location === item.href || (item.href !== "/admin" && location.startsWith(`${item.href}/`));',
              1,
          )
          layout.write_text(text, encoding='utf-8')

          dialog = Path('artifacts/wildflower-crm/src/components/feedback-dialog.tsx')
          text = dialog.read_text(encoding='utf-8')
          text = text.replace(
              'are included when available and can be viewed only by\n              authenticated CRM administrators.',
              'are included when available, stored in the CRM’s private object\n              storage, and added to the administrator review queue.',
              1,
          )
          dialog.write_text(text, encoding='utf-8')
          PY

      - name: Install updated dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format touched source
        run: |
          pnpm exec prettier --write \
            lib/db/src/schema/appFeedback.ts \
            artifacts/api-server/src/routes/appFeedback.ts \
            artifacts/api-server/src/__tests__/app-feedback.integration.test.ts \
            artifacts/wildflower-crm/src/lib/feedback-api.ts \
            artifacts/wildflower-crm/src/lib/feedback-capture.ts \
            artifacts/wildflower-crm/src/lib/feedback-capture.test.ts \
            artifacts/wildflower-crm/src/components/feedback-dialog.tsx \
            artifacts/wildflower-crm/src/pages/admin-feedback.tsx \
            artifacts/wildflower-crm/package.json

      - name: Build schema and validate migration
        run: |
          pnpm --filter @workspace/db run push-force
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0219_app_feedback.sql

      - name: Typecheck
        run: |
          pnpm run check:api
          pnpm run check:web

      - name: Run focused tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/app-feedback.integration.test.ts
          pnpm --filter @workspace/wildflower-crm exec vitest run \
            src/lib/feedback-capture.test.ts

      - name: Commit validated implementation
        run: |
          rm -rf .agent
          rm -f .github/workflows/validate-app-feedback.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add in-app feedback capture and admin review"
          git push origin HEAD:agent/app-feedback-workflow-v2
