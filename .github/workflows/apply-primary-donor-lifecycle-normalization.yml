name: Apply primary donor lifecycle normalization

on:
  push:
    branches: [agent/normalize-donor-clusters-all-lifecycle]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_donor_lifecycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_donor_lifecycle"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_donor_lifecycle
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: donor-lifecycle-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/normalize-donor-clusters-all-lifecycle
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Extend export and make production seeds environment-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('lib/db/migrations/0225_normalize_primary_donor_paths.sql')
          sql = migration.read_text()

          peretsman_marker = "INSERT INTO donor_routing_preferences (\n  id,\n  source_kind,\n  source_household_id,"
          if sql.count(peretsman_marker) != 1:
              raise RuntimeError('Could not locate Peretsman route insert')
          sql = sql.replace(
              peretsman_marker,
              "DO $peretsman_route$\nBEGIN\n  IF EXISTS (\n    SELECT 1 FROM households\n    WHERE id = 'recIJTPGCH2DtgplA' AND archived_at IS NULL\n  ) AND EXISTS (\n    SELECT 1 FROM organizations\n    WHERE id = 'recEnJihmxpxL6Mes' AND archived_at IS NULL\n  ) THEN\n" + peretsman_marker,
              1,
          )
          peretsman_end = "  updated_by_user_id = NULL,\n  updated_at = now();\n\n-- Every Avi/Sandra Nash record"
          if sql.count(peretsman_end) != 1:
              raise RuntimeError('Could not locate Peretsman route insert end')
          sql = sql.replace(
              peretsman_end,
              "  updated_by_user_id = NULL,\n  updated_at = now();\n  END IF;\nEND;\n$peretsman_route$;\n\n-- Every Avi/Sandra Nash record",
              1,
          )

          nash_marker = "INSERT INTO donor_routing_preferences (\n  id,\n  source_kind,\n  source_organization_id,"
          if sql.count(nash_marker) != 1:
              raise RuntimeError('Could not locate Nash route insert')
          sql = sql.replace(
              nash_marker,
              "DO $nash_route$\nBEGIN\n  IF EXISTS (\n    SELECT 1 FROM organizations\n    WHERE id = 'recR28K8Twq5uV8Q0' AND archived_at IS NULL\n  ) AND EXISTS (\n    SELECT 1 FROM households\n    WHERE id = 'rec673AHumJJiIPSy' AND archived_at IS NULL\n  ) THEN\n" + nash_marker,
              1,
          )
          nash_end = "  updated_by_user_id = NULL,\n  updated_at = now();\n\nCREATE TEMP TABLE donor_cluster_map"
          if sql.count(nash_end) != 1:
              raise RuntimeError('Could not locate Nash route insert end')
          sql = sql.replace(
              nash_end,
              "  updated_by_user_id = NULL,\n  updated_at = now();\n  END IF;\nEND;\n$nash_route$;\n\nCREATE TEMP TABLE donor_cluster_map",
              1,
          )

          final_anchor = "ON CONFLICT (id) DO NOTHING;\n\nCOMMIT;"
          if sql.count(final_anchor) != 1:
              raise RuntimeError('Could not locate final route-audit block')
          sql = sql.replace(
              final_anchor,
              "ON CONFLICT (id) DO NOTHING;\n\n-- Avoid phantom route-audit rows in non-production databases where the\n-- approved production donor records do not exist.\nDELETE FROM audit_log\nWHERE id = 'audit_donor_route_0225_peretsman_household'\n  AND NOT EXISTS (SELECT 1 FROM households WHERE id = 'recIJTPGCH2DtgplA');\nDELETE FROM audit_log\nWHERE id = 'audit_donor_route_0225_indira_household'\n  AND NOT EXISTS (SELECT 1 FROM organizations WHERE id = 'recR28K8Twq5uV8Q0');\n\nCOMMIT;",
              1,
          )
          migration.write_text(sql)

          exporter = Path('scripts/src/export-donor-attribution.ts')
          text = exporter.read_text()
          replacements = [
              (
                  '  giftsAndPayments,\n  households,',
                  '  giftsAndPayments,\n  opportunitiesAndPledges,\n  households,',
              ),
              (
                  '    giftRows,\n    unitRows,',
                  '    giftRows,\n    opportunityRows,\n    unitRows,',
              ),
              (
                  '      purpose: "donor attribution and preferred-pathway analysis",',
                  '      purpose: "gift, opportunity, and pledge attribution and preferred-pathway analysis",',
              ),
              (
                  '    gifts: giftRows,\n    paymentUnits: unitRows,',
                  '    gifts: giftRows,\n    opportunitiesAndPledges: opportunityRows,\n    paymentUnits: unitRows,',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'Could not locate exporter anchor: {old!r}')
              text = text.replace(old, new, 1)

          unit_query_anchor = '''    db
      .select({
        id: paymentUnits.id,
'''
          if text.count(unit_query_anchor) != 1:
              raise RuntimeError('Could not locate payment-unit query anchor')
          opportunity_query = '''    db
      .select({
        id: opportunitiesAndPledges.id,
        name: opportunitiesAndPledges.name,
        askAmount: opportunitiesAndPledges.askAmount,
        awardedAmount: opportunitiesAndPledges.awardedAmount,
        paid: opportunitiesAndPledges.paid,
        status: opportunitiesAndPledges.status,
        stage: opportunitiesAndPledges.stage,
        commitmentPath: opportunitiesAndPledges.commitmentPath,
        verbalCommitmentAt: opportunitiesAndPledges.verbalCommitmentAt,
        pledgeCommittedAt: opportunitiesAndPledges.pledgeCommittedAt,
        projectedCloseDate: opportunitiesAndPledges.projectedCloseDate,
        actualCompletionDate: opportunitiesAndPledges.actualCompletionDate,
        organizationId: opportunitiesAndPledges.organizationId,
        individualGiverPersonId:
          opportunitiesAndPledges.individualGiverPersonId,
        householdId: opportunitiesAndPledges.householdId,
        individualAdvisorPersonId:
          opportunitiesAndPledges.individualAdvisorPersonId,
        primaryContactPersonId: opportunitiesAndPledges.primaryContactPersonId,
        archivedAt: opportunitiesAndPledges.archivedAt,
      })
      .from(opportunitiesAndPledges),
'''
          text = text.replace(unit_query_anchor, opportunity_query + unit_query_anchor, 1)
          exporter.write_text(text)

          docs = Path('docs/donor-attribution-export.md')
          doc = docs.read_text()
          old = 'This export is for reviewing preferred donor pathways, household groupings, DAF\nusage, and inconsistent donor attribution against production-shaped data.'
          new = 'This export is for reviewing preferred donor pathways, household groupings, DAF\nusage, and inconsistent gift, opportunity, and pledge attribution against\nproduction-shaped data.'
          if doc.count(old) != 1:
              raise RuntimeError('Could not locate export-doc description')
          docs.write_text(doc.replace(old, new, 1))
          PY

      - run: pnpm install --frozen-lockfile

      - name: Establish current schema and prior donor lifecycle migrations
        run: |
          pnpm --filter @workspace/db run push-force
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0222_donor_attribution_phase_2.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0223_donor_attribution_phase_3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0224_opportunity_commitment_lifecycle.sql

      - name: Seed donor clusters before migration 0225
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO households (id, name, created_at, updated_at) VALUES
            ('recIJTPGCH2DtgplA', 'Nancy Peretsman and Bob Scully', now(), now()),
            ('rec673AHumJJiIPSy', 'Avi and Sandra Nash', now(), now());

          INSERT INTO organizations (id, name, created_at, updated_at) VALUES
            ('recEnJihmxpxL6Mes', 'Scully Peretsman Fund', now(), now()),
            ('recR28K8Twq5uV8Q0', 'Indira Foundation', now(), now());

          INSERT INTO people (
            id, full_name, first_name, last_name, primary_household_id,
            anonymous, deceased, newsletter, unsubscribed_to_newsletter,
            created_at, updated_at
          ) VALUES
            ('recEo8nqWp6DxB5tU', 'Nancy Peretsman', 'Nancy', 'Peretsman', 'recIJTPGCH2DtgplA', false, false, false, false, now(), now()),
            ('recwTfTiygjGC8lyw', 'Bob Scully', 'Bob', 'Scully', 'recIJTPGCH2DtgplA', false, false, false, false, now(), now()),
            ('recjOa1ezzMRJmfP7', 'Avi Nash', 'Avi', 'Nash', 'rec673AHumJJiIPSy', false, false, false, false, now(), now()),
            ('rechFxTLLlbH9c3m6', 'Sandra Nash', 'Sandra', 'Nash', 'rec673AHumJJiIPSy', false, false, false, false, now(), now());

          -- Existing direct Nancy route is intentionally replaced by the shared
          -- individual -> primary household -> fund path in migration 0225.
          INSERT INTO donor_routing_preferences (
            id, source_kind, source_person_id, mode, target_kind,
            target_organization_id, created_at, updated_at
          ) VALUES (
            'test_nancy_direct', 'individual', 'recEo8nqWp6DxB5tU', 'target',
            'organization', 'recEnJihmxpxL6Mes', now(), now()
          );

          INSERT INTO gifts_and_payments (
            id, name, amount, date_received, household_id, archived_at,
            created_at, updated_at
          ) VALUES
            ('test_peretsman_household_gift', 'Peretsman household gift', 100, '2024-01-01', 'recIJTPGCH2DtgplA', NULL, now(), now()),
            ('test_peretsman_archived_gift', 'Archived Peretsman gift', 50, '2020-01-01', 'recIJTPGCH2DtgplA', now(), now(), now());

          INSERT INTO gifts_and_payments (
            id, name, amount, date_received, organization_id, archived_at,
            created_at, updated_at
          ) VALUES
            ('test_nash_org_gift', 'Indira gift', 200, '2024-02-01', 'recR28K8Twq5uV8Q0', NULL, now(), now()),
            ('test_nash_archived_gift', 'Archived Indira gift', 75, '2020-02-01', 'recR28K8Twq5uV8Q0', now(), now(), now());

          INSERT INTO opportunities_and_pledges (
            id, name, household_id, status, conditions_met, written_pledge,
            paid, loan_or_grant, disbursement_model, is_write_off,
            created_at, updated_at
          ) VALUES
            ('test_peretsman_opportunity', 'Peretsman opportunity', 'recIJTPGCH2DtgplA', 'open', 'no', false, 0, 'grant', 'fixed_commitment', false, now(), now());

          INSERT INTO opportunities_and_pledges (
            id, name, organization_id, status, conditions_met, written_pledge,
            paid, loan_or_grant, disbursement_model, is_write_off,
            commitment_path, verbal_commitment_at, pledge_committed_at,
            archived_at, created_at, updated_at
          ) VALUES
            ('test_nash_pledge', 'Nash pledge', 'recR28K8Twq5uV8Q0', 'pledge', 'no', true, 0, 'grant', 'fixed_commitment', false, 'verbal_pledge', '2024-03-01', '2024-03-01', NULL, now(), now()),
            ('test_nash_archived_opportunity', 'Archived Nash opportunity', 'recR28K8Twq5uV8Q0', 'open', 'no', false, 0, 'grant', 'fixed_commitment', false, NULL, NULL, NULL, now(), now(), now());
          SQL

      - name: Apply migration 0225
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0225_normalize_primary_donor_paths.sql

      - name: Verify historical normalization and new opportunity routing
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n
            FROM gifts_and_payments
            WHERE id IN ('test_peretsman_household_gift', 'test_peretsman_archived_gift')
              AND organization_id = 'recEnJihmxpxL6Mes'
              AND household_id IS NULL
              AND individual_giver_person_id IS NULL;
            IF n <> 2 THEN RAISE EXCEPTION 'Peretsman gifts were not normalized: %', n; END IF;

            SELECT count(*) INTO n
            FROM gifts_and_payments
            WHERE id IN ('test_nash_org_gift', 'test_nash_archived_gift')
              AND household_id = 'rec673AHumJJiIPSy'
              AND organization_id IS NULL
              AND individual_giver_person_id IS NULL;
            IF n <> 2 THEN RAISE EXCEPTION 'Nash gifts were not normalized: %', n; END IF;

            SELECT count(*) INTO n
            FROM opportunities_and_pledges
            WHERE id = 'test_peretsman_opportunity'
              AND organization_id = 'recEnJihmxpxL6Mes'
              AND household_id IS NULL;
            IF n <> 1 THEN RAISE EXCEPTION 'Peretsman opportunity was not normalized'; END IF;

            SELECT count(*) INTO n
            FROM opportunities_and_pledges
            WHERE id IN ('test_nash_pledge', 'test_nash_archived_opportunity')
              AND household_id = 'rec673AHumJJiIPSy'
              AND organization_id IS NULL;
            IF n <> 2 THEN RAISE EXCEPTION 'Nash opportunity/pledge rows were not normalized: %', n; END IF;

            IF EXISTS (
              SELECT 1 FROM donor_routing_preferences
              WHERE source_person_id = 'recEo8nqWp6DxB5tU'
            ) THEN RAISE EXCEPTION 'Nancy direct route was not retired'; END IF;
          END $$;

          INSERT INTO opportunities_and_pledges (
            id, name, individual_giver_person_id, status, conditions_met,
            written_pledge, paid, loan_or_grant, disbursement_model,
            is_write_off, created_at, updated_at
          ) VALUES (
            'test_new_nancy_opportunity', 'New Nancy opportunity',
            'recEo8nqWp6DxB5tU', 'open', 'no', false, 0, 'grant',
            'fixed_commitment', false, now(), now()
          );

          INSERT INTO opportunities_and_pledges (
            id, name, organization_id, status, conditions_met,
            written_pledge, paid, loan_or_grant, disbursement_model,
            is_write_off, created_at, updated_at
          ) VALUES (
            'test_new_indira_opportunity', 'New Indira opportunity',
            'recR28K8Twq5uV8Q0', 'open', 'no', false, 0, 'grant',
            'fixed_commitment', false, now(), now()
          );

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM opportunities_and_pledges
              WHERE id = 'test_new_nancy_opportunity'
                AND organization_id = 'recEnJihmxpxL6Mes'
                AND household_id IS NULL
                AND individual_giver_person_id IS NULL
            ) THEN RAISE EXCEPTION 'New Nancy opportunity did not follow the route'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM opportunities_and_pledges
              WHERE id = 'test_new_indira_opportunity'
                AND household_id = 'rec673AHumJJiIPSy'
                AND organization_id IS NULL
                AND individual_giver_person_id IS NULL
            ) THEN RAISE EXCEPTION 'New Indira opportunity did not follow the route'; END IF;

            IF (SELECT count(*) FROM audit_log WHERE id LIKE 'audit_donor_cluster_0225_%') < 8 THEN
              RAISE EXCEPTION 'Expected row-level donor normalization audit entries';
            END IF;
          END $$;
          SQL

      - name: Type-check scripts and API
        run: |
          pnpm --filter @workspace/scripts run typecheck
          pnpm run check:api

      - name: Verify lifecycle export
        shell: bash
        run: |
          DONOR_ATTRIBUTION_EXPORT_PATH=/tmp/donor-lifecycle.json.gz \
            pnpm --filter @workspace/scripts run export:donor-attribution
          python - <<'PY'
          import gzip, json
          with gzip.open('/tmp/donor-lifecycle.json.gz', 'rt', encoding='utf-8') as f:
              data = json.load(f)
          rows = data.get('opportunitiesAndPledges')
          if not isinstance(rows, list) or len(rows) < 5:
              raise SystemExit('Lifecycle export is missing opportunitiesAndPledges')
          ids = {row['id'] for row in rows}
          required = {
              'test_peretsman_opportunity',
              'test_nash_pledge',
              'test_nash_archived_opportunity',
              'test_new_nancy_opportunity',
              'test_new_indira_opportunity',
          }
          missing = required - ids
          if missing:
              raise SystemExit(f'Lifecycle export missing rows: {sorted(missing)}')
          PY

      - name: Finalize branch
        shell: bash
        run: |
          git diff --check
          rm -f .github/workflows/apply-primary-donor-lifecycle-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize donor paths across gifts and opportunities"
          git push origin HEAD:agent/normalize-donor-clusters-all-lifecycle
