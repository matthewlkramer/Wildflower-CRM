name: Validate final detail actions

on:
  push:
    branches: [agent/detail-action-lifecycle]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_detail_actions
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_detail_actions"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_detail_actions
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: detail-actions-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/detail-action-lifecycle
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert implementation surface
        run: |
          test -f artifacts/api-server/src/routes/detailActions.ts
          test -f artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx
          test -f artifacts/wildflower-crm/src/components/donor-fundraising-actions.tsx
          grep -q "convert-pledge-to-standalone-gift" artifacts/api-server/src/routes/detailActions.ts
          grep -q "rewrittenAsOriginallyStandaloneGift" artifacts/api-server/src/routes/detailActions.ts
          grep -q "Record pending gift" artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx
          grep -q "Link reimbursement payment" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx
          grep -q "Split into pledge" artifacts/wildflower-crm/src/pages/gift-detail.tsx
          ! grep -q "Record payment (via reconciliation workbench)" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx
          ! grep -Eq "navigate\(['\"]\/reconciliation|href=['\"]\/reconciliation" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx artifacts/wildflower-crm/src/components/donor-fundraising-actions.tsx
      - name: Establish schema
        run: pnpm --filter @workspace/db run push-force
      - name: Generate API clients
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts['generate:api']?0:1)"; then pnpm run generate:api; fi
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts['api:generate']?0:1)"; then pnpm run api:generate; fi
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts['codegen']?0:1)"; then pnpm run codegen; fi
      - name: Typecheck
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/wildflower-crm typecheck
      - name: Focused lifecycle tests
        run: |
          files=()
          for f in \
            src/__tests__/detail-actions.integration.test.ts \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/donor-attribution-phase3.integration.test.ts \
            src/__tests__/opportunity-commitment-lifecycle.integration.test.ts; do
            [ -f "artifacts/api-server/$f" ] && files+=("$f")
          done
          pnpm --filter @workspace/api-server exec vitest run "${files[@]}" --reporter=verbose
      - name: Formatting and diff checks
        run: |
          changed=$(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx|js|jsx|json|ya?ml|md)$' || true)
          if [ -n "$changed" ]; then pnpm exec prettier --check $changed; fi
          git diff --check origin/main...HEAD
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          printf 'result=%s\ncommit=%s\nvalidated_at=%s\n' "$RESULT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > detail-actions-validation-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add detail-actions-validation-result.txt
          git commit -m "Record detail action validation: $RESULT" || true
          git push origin HEAD:agent/detail-action-lifecycle
          if [ "$RESULT" = success ]; then gh pr ready 104 --repo matthewlkramer/Wildflower-CRM; fi
