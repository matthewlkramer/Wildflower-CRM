name: Validate and clean PR 106 detail actions

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: validate-pr106-detail-actions
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.number == 106 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/detail-action-lifecycle-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_detail_actions_pr106
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_detail_actions_pr106"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_detail_actions_pr106
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: detail-actions-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
      TARGET_BRANCH: agent/detail-action-lifecycle-v2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Stop after the cleanup commit
        id: guard
        shell: bash
        run: |
          subject=$(git log -1 --pretty=%s)
          if [ "$subject" = "Clean and validate detail action implementation" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Remove staging files and restore clean generated baseline
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git fetch origin main
          rm -f \
            .github/workflows/apply-detail-actions-v2.yml \
            detail-actions-trigger.txt \
            detail-actions-validation-trigger.txt
          git checkout origin/main -- \
            lib/api-client-react/src/generated \
            lib/api-zod/src/generated \
            lib/api-spec/codegen.sh \
            lib/api-spec/codegen-check.sh

      - name: Limit generated whitespace normalization to affected operations
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacement = '''# Orval emits trailing spaces in some operation templates. Normalize only
          # the generated files affected by this contract change, plus the existing
          # reconciliation normalization, so unrelated generated files remain untouched.
          for rel in \\
            reconciliation/reconciliation.ts \\
            gifts-and-payments/gifts-and-payments.ts \\
            opportunities-and-pledges/opportunities-and-pledges.ts; do
            file="$tmp/lib/api-client-react/src/generated/$rel"
            [ -f "$file" ] && sed -i 's/[[:space:]]*$//' "$file"
          done'''

          for name in ("codegen.sh", "codegen-check.sh"):
              path = Path("lib/api-spec") / name
              text = path.read_text()
              old_long = '''# Orval emits trailing spaces in this file's bodyless mutation templates.
          # Normalize the whole file so output is byte-stable and future mutation
          # operations need no per-operation handling.
          sed -i 's/[[:space:]]*$//' \\
            "$tmp/lib/api-client-react/src/generated/reconciliation/reconciliation.ts"'''
              old_short = '''sed -i 's/[[:space:]]*$//' \\
            "$tmp/lib/api-client-react/src/generated/reconciliation/reconciliation.ts"'''
              if old_long in text:
                  text = text.replace(old_long, replacement, 1)
              elif old_short in text:
                  text = text.replace(old_short, replacement, 1)
              else:
                  raise SystemExit(f"Could not find normalization block in {path}")
              path.write_text(text)
          PY
          bash -n lib/api-spec/codegen.sh
          bash -n lib/api-spec/codegen-check.sh

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'

      - name: Generate and verify API clients
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm --filter @workspace/api-spec run codegen
          pnpm --filter @workspace/api-spec run codegen:check

      - name: Establish disposable schema
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter @workspace/db run push-force

      - name: Typecheck API and web
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/wildflower-crm run typecheck

      - name: Run focused database-backed tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          files=()
          for file in \
            src/__tests__/fundraising-record-actions.integration.test.ts \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/donor-attribution-phase3.integration.test.ts \
            src/__tests__/opportunity-commitment-lifecycle.integration.test.ts \
            src/__tests__/pledge-payment-lifecycle.integration.test.ts; do
            [ -f "artifacts/api-server/$file" ] && files+=("$file")
          done
          pnpm --filter @workspace/api-server exec vitest run "${files[@]}" --reporter=verbose

      - name: Check diff integrity and generated scope
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git diff --check
          count=$(git diff --name-only origin/main...HEAD -- \
            lib/api-client-react/src/generated \
            lib/api-zod/src/generated | wc -l)
          echo "Generated files changed: $count"
          test "$count" -le 15

      - name: Commit validated cleanup
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clean and validate detail action implementation"
          git push origin HEAD:$TARGET_BRANCH
