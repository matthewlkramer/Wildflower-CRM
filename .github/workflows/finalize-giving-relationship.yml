name: Finalize giving relationship diff

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/giving-relationship-record-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_giving_relationship
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_giving_relationship"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_giving_relationship
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: giving-relationship-test-key

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/giving-relationship-record-pages
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reset churned files to main
        run: |
          git checkout origin/main -- \
            lib/api-spec/openapi.yaml \
            lib/api-client-react/src/generated/api.schemas.ts \
            lib/api-client-react/src/generated/donor-routing/donor-routing.ts \
            lib/api-zod/src/generated/donor-routing/donor-routing.ts \
            artifacts/wildflower-crm/src/pages/individual-detail.tsx \
            artifacts/wildflower-crm/src/pages/funding-entity-detail.tsx \
            artifacts/wildflower-crm/src/pages/household-detail.tsx

      - name: Reapply narrow API and page edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          spec = Path("lib/api-spec/openapi.yaml")
          text = spec.read_text()
          path_marker = "  /donor-routing/{sourceKind}/{sourceId}:"
          path_block = "\n".join([
              "  /giving-relationships/{sourceKind}/{sourceId}:",
              "    get:",
              "      operationId: getGivingRelationship",
              "      tags: [donor-routing]",
              "      summary: Get a deduplicated giving relationship for a donor record.",
              "      description: >-",
              "        Returns donor-of-record giving, household or household-member giving,",
              "        current-principal organization giving, intermediary delivery totals, and",
              "        recent gifts. Intermediary totals overlap the relationship total and are",
              "        never treated as additional giving.",
              "      parameters:",
              "        - { name: sourceKind, in: path, required: true, schema: { $ref: \"#/components/schemas/DonorRecordKind\" } }",
              "        - { name: sourceId, in: path, required: true, schema: { type: string } }",
              "      responses:",
              "        \"200\": { description: OK, content: { application/json: { schema: { $ref: \"#/components/schemas/GivingRelationship\" } } } }",
              "        \"400\": { $ref: \"#/components/responses/BadRequest\" }",
              "        \"404\": { $ref: \"#/components/responses/NotFound\" }",
              "",
          ])
          if text.count(path_marker) != 1:
              raise RuntimeError("donor-routing path marker not found exactly once")
          text = text.replace(path_marker, path_block + path_marker, 1)

          schema_marker = '    # ─── Donor payment-intermediaries ("gives through") ─────────────────────────\n'
          schema_block = "\n".join([
              "    # ─── Giving relationship views ─────────────────────────────────────────────",
              "    GivingRelationshipAttributionKind:",
              "      type: string",
              "      enum: [direct, household, household_member, principal_organization]",
              "    GivingRelationshipDonor:",
              "      type: object",
              "      required: [kind, id, name]",
              "      properties:",
              "        kind: { $ref: \"#/components/schemas/DonorRecordKind\" }",
              "        id:   { type: string }",
              "        name: { type: string }",
              "    GivingRelationshipBreakdown:",
              "      type: object",
              "      required: [kind, label, description, amount, giftCount]",
              "      properties:",
              "        kind:        { $ref: \"#/components/schemas/GivingRelationshipAttributionKind\" }",
              "        label:       { type: string }",
              "        description: { type: string }",
              "        amount:      { type: string, description: \"Decimal amount as a string.\" }",
              "        giftCount:   { type: integer }",
              "    GivingRelationshipIntermediary:",
              "      type: object",
              "      required: [id, name]",
              "      properties:",
              "        id:   { type: string }",
              "        name: { type: string }",
              "    GivingRelationshipGift:",
              "      type: object",
              "      required: [id, amount, donor, attributionKind, attributionLabel]",
              "      properties:",
              "        id:                  { type: string }",
              "        name:                { type: string, nullable: true }",
              "        amount:              { type: string }",
              "        dateReceived:        { type: string, format: date, nullable: true }",
              "        paymentMethod:       { type: string, nullable: true }",
              "        donor:               { $ref: \"#/components/schemas/GivingRelationshipDonor\" }",
              "        paymentIntermediary: { allOf: [ { $ref: \"#/components/schemas/GivingRelationshipIntermediary\" } ], nullable: true }",
              "        attributionKind:     { $ref: \"#/components/schemas/GivingRelationshipAttributionKind\" }",
              "        attributionLabel:    { type: string }",
              "    GivingRelationshipLargestGift:",
              "      type: object",
              "      required: [id, amount]",
              "      properties:",
              "        id:           { type: string }",
              "        amount:       { type: string }",
              "        dateReceived: { type: string, format: date, nullable: true }",
              "    GivingRelationship:",
              "      type: object",
              "      required:",
              "        [source, requiresDecision, relationshipTotal, donorOfRecordTotal,",
              "         throughIntermediaryTotal, giftCount, breakdown, recentGifts]",
              "      properties:",
              "        source:                   { $ref: \"#/components/schemas/GivingRelationshipDonor\" }",
              "        resolvedDonor:            { allOf: [ { $ref: \"#/components/schemas/GivingRelationshipDonor\" } ], nullable: true }",
              "        requiresDecision:         { type: boolean }",
              "        relationshipTotal:        { type: string, description: \"Each related gift counted once.\" }",
              "        donorOfRecordTotal:       { type: string, description: \"Gifts recorded directly to this exact record.\" }",
              "        throughIntermediaryTotal: { type: string, description: \"Overlapping delivery-method total; not additive.\" }",
              "        giftCount:                { type: integer }",
              "        mostRecentGiftDate:       { type: string, format: date, nullable: true }",
              "        largestGift:              { allOf: [ { $ref: \"#/components/schemas/GivingRelationshipLargestGift\" } ], nullable: true }",
              "        breakdown:                { type: array, items: { $ref: \"#/components/schemas/GivingRelationshipBreakdown\" } }",
              "        recentGifts:              { type: array, items: { $ref: \"#/components/schemas/GivingRelationshipGift\" } }",
              "",
          ])
          if text.count(schema_marker) != 1:
              raise RuntimeError("donor intermediary schema marker not found exactly once")
          spec.write_text(text.replace(schema_marker, schema_block + schema_marker, 1))

          replace_once(
              "artifacts/wildflower-crm/src/pages/individual-detail.tsx",
              'import { GivingPipelineCard } from "@/components/giving-pipeline-card";\n',
              'import { GivingPipelineCard } from "@/components/giving-pipeline-card";\nimport { GivingRelationshipCard } from "@/components/giving-relationship-card";\n',
          )
          replace_once(
              "artifacts/wildflower-crm/src/pages/individual-detail.tsx",
              '          <PinnedMediaCard personId={person.id} />\n          <GivingPipelineCard scope={{ individualGiverPersonId: person.id }} />',
              '          <PinnedMediaCard personId={person.id} />\n          <GivingRelationshipCard sourceKind="individual" sourceId={person.id} />\n          <GivingPipelineCard scope={{ individualGiverPersonId: person.id }} />',
          )

          replace_once(
              "artifacts/wildflower-crm/src/pages/funding-entity-detail.tsx",
              'import { GivingPipelineCard } from "@/components/giving-pipeline-card";\n',
              'import { GivingPipelineCard } from "@/components/giving-pipeline-card";\nimport { GivingRelationshipCard } from "@/components/giving-relationship-card";\n',
          )
          replace_once(
              "artifacts/wildflower-crm/src/pages/funding-entity-detail.tsx",
              '          <PinnedMediaCard organizationId={org.id} />\n          <GivingPipelineCard scope={{ organizationId: org.id }} />',
              '          <PinnedMediaCard organizationId={org.id} />\n          <GivingRelationshipCard sourceKind="organization" sourceId={org.id} />\n          <GivingPipelineCard scope={{ organizationId: org.id }} />',
          )

          replace_once(
              "artifacts/wildflower-crm/src/pages/household-detail.tsx",
              'import { PreferredDonorCard } from "@/components/preferred-donor-card";\n',
              'import { PreferredDonorCard } from "@/components/preferred-donor-card";\nimport { GivingRelationshipCard } from "@/components/giving-relationship-card";\n',
          )
          replace_once(
              "artifacts/wildflower-crm/src/pages/household-detail.tsx",
              '          <PreferredDonorCard sourceKind="household" sourceId={household.id} />',
              '          <GivingRelationshipCard sourceKind="household" sourceId={household.id} />\n\n          <PreferredDonorCard sourceKind="household" sourceId={household.id} />',
          )
          PY

      - name: Establish current schema
        run: pnpm --filter @workspace/db run push-force

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web

      - name: Run focused integration tests
        run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/giving-relationship.integration.test.ts

      - name: Remove finalizer
        run: rm -f .github/workflows/finalize-giving-relationship.yml

      - name: Commit finalized diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Minimize giving relationship diff"
          git push origin HEAD:agent/giving-relationship-record-pages
