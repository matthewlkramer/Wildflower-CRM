name: Inspect opportunity lifecycle payload

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/opportunity-commitment-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-commitment-lifecycle
      - name: Apply recovered patch and print API error contexts
        shell: bash
        run: |
          set +e
          cat .github/scripts/apply_opportunity_commitment_lifecycle.py.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/apply.py
          set -e
          sed -i '$d' /tmp/apply.py
          cat .github/scripts/apply_opportunity_commitment_lifecycle.py.tail >> /tmp/apply.py
          python .github/scripts/fix_lifecycle_payload_openapi_patch.py /tmp/apply.py
          python /tmp/apply.py
          echo '--- pledgeStage 250-280 ---'
          nl -ba artifacts/api-server/src/lib/pledgeStage.ts | sed -n '250,280p'
          echo '--- route 795-820 ---'
          nl -ba artifacts/api-server/src/routes/opportunitiesAndPledges.ts | sed -n '795,820p'
          echo '--- route 1018-1040 ---'
          nl -ba artifacts/api-server/src/routes/opportunitiesAndPledges.ts | sed -n '1018,1040p'
          exit 1
