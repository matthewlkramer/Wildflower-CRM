name: Inspect opportunity lifecycle payload

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/opportunity-commitment-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-commitment-lifecycle
      - name: Recover and print OpenAPI patch section
        shell: bash
        run: |
          set +e
          cat .github/scripts/apply_opportunity_commitment_lifecycle.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/apply.py
          set -e
          sed -i '$d' /tmp/apply.py
          cat .github/scripts/apply_opportunity_commitment_lifecycle.py.tail >> /tmp/apply.py
          echo "--- SCRIPT 1030-1125 ---"
          nl -ba /tmp/apply.py | sed -n '1030,1125p'
          echo "--- CURRENT OPENAPI writtenPledge CONTEXT ---"
          grep -n -B 8 -A 12 'writtenPledge:' lib/api-spec/openapi.yaml | head -n 120 || true
          exit 1
