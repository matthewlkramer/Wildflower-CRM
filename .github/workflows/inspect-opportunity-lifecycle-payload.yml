name: Inspect opportunity lifecycle payload

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/opportunity-commitment-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-commitment-lifecycle
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply recovered patch and inspect generated enum declarations
        shell: bash
        run: |
          set +e
          cat .github/scripts/apply_opportunity_commitment_lifecycle.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/apply.py
          set -e
          sed -i '$d' /tmp/apply.py
          cat .github/scripts/apply_opportunity_commitment_lifecycle.py.tail >> /tmp/apply.py
          python .github/scripts/fix_lifecycle_payload_openapi_patch.py /tmp/apply.py
          python -m py_compile /tmp/apply.py
          python /tmp/apply.py
          echo "--- OPENAPI ENUM CONTEXT ---"
          grep -n -B 8 -A 24 'OpportunityCommitmentPath' lib/api-spec/openapi.yaml | head -n 160 || true
          pnpm --filter @workspace/api-spec run codegen
          echo "--- GENERATED DECLARATIONS ---"
          grep -n -B 4 -A 10 'OpportunityCommitmentPath\|OpportunityOutcomeType' lib/api-client-react/src/generated/api.schemas.ts | head -n 240 || true
          exit 1
