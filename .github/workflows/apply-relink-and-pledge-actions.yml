name: Apply relink and pledge-action hotfix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-relink-and-pledge-actions.yml

permissions:
  contents: write

concurrency:
  group: apply-relink-and-pledge-actions
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.head_ref == 'agent/fix-relink-and-pledge-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-relink-and-pledge-actions

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          settlement = Path(
              "artifacts/wildflower-crm/src/components/reconciliation-bundles/settlement-actions.ts"
          )
          settlement_text = settlement.read_text()
          if "export function apiErrorHasIssue" not in settlement_text:
              settlement.write_text(
                  settlement_text.rstrip()
                  + '''

          /** True when an API error includes the named machine-readable gate issue. */
          export function apiErrorHasIssue(err: unknown, code: string): boolean {
            if (!err || typeof err !== "object") return false;
            const data = (err as { data?: unknown }).data;
            if (!data || typeof data !== "object") return false;
            const details = (data as { details?: unknown }).details;
            if (!details || typeof details !== "object") return false;
            const issues = (details as { issues?: unknown }).issues;
            if (!Array.isArray(issues)) return false;
            return issues.some(
              (issue) =>
                typeof issue === "object" &&
                issue !== null &&
                "code" in issue &&
                (issue as { code?: unknown }).code === code,
            );
          }
          '''
              )

          Path(
              "artifacts/wildflower-crm/src/components/reconciliation-bundles/settlement-actions.test.ts"
          ).write_text(
              '''import { describe, expect, it } from "vitest";
          import { apiErrorHasIssue } from "./settlement-actions";

          describe("apiErrorHasIssue", () => {
            it("finds a nested consistency-gate issue", () => {
              const err = {
                status: 409,
                data: {
                  error: "consistency_gate",
                  details: {
                    issues: [
                      {
                        code: "gift_already_stripe_sourced",
                        message: "Already sourced",
                      },
                    ],
                  },
                },
              };

              expect(apiErrorHasIssue(err, "gift_already_stripe_sourced")).toBe(true);
              expect(apiErrorHasIssue(err, "gift_already_qb_linked")).toBe(false);
            });

            it("returns false for ordinary API errors", () => {
              expect(
                apiErrorHasIssue(
                  { status: 409, data: { error: "not_pending" } },
                  "gift_already_stripe_sourced",
                ),
              ).toBe(false);
            });
          });
          '''
          )

          replace_once(
              "artifacts/wildflower-crm/src/components/reconciliation-deposits/gift-placement.tsx",
              "\nfunction componentAnchor(\n",
              "\nexport function componentAnchor(\n",
          )

          rows_path = "artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx"
          rows = Path(rows_path).read_text()
          if 'import { componentAnchor } from "./gift-placement";' not in rows:
              replace_once(
                  rows_path,
                  '} from "./presentation";\n',
                  '} from "./presentation";\nimport { componentAnchor } from "./gift-placement";\n',
              )
          replace_once(
              rows_path,
              '''            // Staged anchor only while the QB row is actionable (pending);
                      // otherwise act on the decomposed payment unit directly.
                      const anchor: AnchorRef =
                        component.stagedPaymentId && component.stagedActionable === true
                          ? {
                              kind: "staged",
                              id: component.stagedPaymentId,
                              label: componentTitle(component),
                            }
                          : {
                              kind: "component",
                              id: component.componentId,
                              label: componentTitle(component),
                              bankDepositId: deposit.anchorId,
                              amount: component.amount,
                              paymentUnitId: component.paymentUnitId ?? undefined,
                            };''',
              '''            // Use the same canonical resolver as column-level placement: an
                      // existing payment unit wins over its actionable QuickBooks source.
                      const anchor: AnchorRef =
                        componentAnchor(deposit, component) ?? {
                          kind: "component",
                          id: component.componentId,
                          label: componentTitle(component),
                          bankDepositId: deposit.anchorId,
                          amount: component.amount,
                          paymentUnitId: component.paymentUnitId ?? undefined,
                        };''',
          )

          page_path = "artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx"
          replace_once(
              page_path,
              '''import {
            apiErrorMessage,
            is409,
          } from "@/components/reconciliation-bundles/settlement-actions";''',
              '''import {
            apiErrorHasIssue,
            apiErrorMessage,
            is409,
          } from "@/components/reconciliation-bundles/settlement-actions";''',
          )
          replace_once(
              page_path,
              '''    if (anchor.kind === "charge") {
                await linkCharge.mutateAsync({ id: anchor.id, data: { giftId } });
              } else if (anchor.kind === "staged") {''',
              '''    if (anchor.kind === "charge") {
                try {
                  await linkCharge.mutateAsync({ id: anchor.id, data: { giftId } });
                } catch (err) {
                  if (!apiErrorHasIssue(err, "gift_already_stripe_sourced")) throw err;
                  const confirmed = window.confirm(
                    "This gift is currently backed by a different Stripe charge.\\n\\nSwitch it to this charge? The prior charge will return to the unmatched-payment queue; the gift itself will remain unchanged.",
                  );
                  if (!confirmed) throw err;
                  await linkCharge.mutateAsync({
                    id: anchor.id,
                    data: { giftId, switchStripeSource: true },
                  });
                }
              } else if (anchor.kind === "staged") {''',
          )
          PY

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          artifacts/wildflower-crm/src/components/reconciliation-bundles/settlement-actions.ts
          artifacts/wildflower-crm/src/components/reconciliation-bundles/settlement-actions.test.ts
          artifacts/wildflower-crm/src/components/reconciliation-deposits/gift-placement.tsx
          artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx
          artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx

      - name: Run focused tests
        run: >-
          pnpm --filter @workspace/wildflower-crm exec vitest run
          src/components/reconciliation-bundles/settlement-actions.test.ts
          src/components/reconciliation-deposits/gift-placement.test.ts

      - name: Run typecheck
        run: pnpm --filter @workspace/wildflower-crm typecheck

      - name: Check patch formatting
        run: git diff --check

      - name: Commit source changes
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add \
            artifacts/wildflower-crm/src/components/reconciliation-bundles/settlement-actions.ts \
            artifacts/wildflower-crm/src/components/reconciliation-bundles/settlement-actions.test.ts \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/gift-placement.tsx \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx \
            artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx
          git commit -m "Fix relink and pledge payment actions"
          git push origin HEAD:agent/fix-relink-and-pledge-actions
