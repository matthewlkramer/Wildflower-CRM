name: Apply opportunity commitment lifecycle follow-ups

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/opportunity-commitment-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_commitment_followups
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_commitment_followups"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_commitment_followups
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: opportunity-commitment-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-commitment-lifecycle
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Establish pre-change schema
        run: pnpm --filter @workspace/db run push-force

      - name: Apply lifecycle follow-up patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_opportunity_commitment_followups.py")
          source = path.read_text()
          brittle = '''replace_exact(
              recon_commit,
              "    // The opp outcomes tie the gift to the\\n  // opportunity via opportunityId so the pledge derives cash_in when fully paid.\\n",
              "    // The opportunity outcome ties the gift to the source record. A finalized\\n  // pledge derives paid/cash-in; an unfinalized opportunity records a direct gift.\\n",
          )
          '''
          if brittle not in source:
              raise RuntimeError("Could not locate the obsolete reconciliation comment edit")
          path.write_text(source.replace(brittle, "", 1))
          PY
          python .github/scripts/apply_opportunity_commitment_followups.py

      - name: Rehearse migration 0224
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0224_opportunity_commitment_lifecycle.sql

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Format changed source and tests
        run: |
          pnpm exec prettier --write \
            lib/db/src/schema/opportunitiesAndPledges.ts \
            lib/api-spec/openapi.yaml \
            artifacts/api-server/src/lib/pledgeStage.ts \
            artifacts/api-server/src/lib/reconciliationCommit.ts \
            artifacts/api-server/src/routes/reconciliation/approve.ts \
            artifacts/api-server/src/routes/opportunitiesAndPledges.ts \
            artifacts/api-server/src/routes/giftsAndPayments.ts \
            artifacts/wildflower-crm/src/lib/reconciliation.ts \
            artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx \
            artifacts/api-server/src/__tests__/derive-opp-fields.test.ts \
            artifacts/api-server/src/__tests__/reconciliation-approve.integration.test.ts \
            artifacts/api-server/src/__tests__/audit-close-resolution.integration.test.ts \
            artifacts/api-server/src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            artifacts/api-server/src/__tests__/opportunity-commitment-reconstruction.integration.test.ts

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web

      - name: Verify retired lifecycle writes are absent
        shell: bash
        run: |
          if git grep -n 'convert_to_pledge_and_first_payment' -- \
            artifacts lib/api-spec lib/api-client-react lib/api-zod; then
            echo 'Retired reconciliation outcome remains in application code.' >&2
            exit 1
          fi

      - name: Run focused lifecycle and correction tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/derive-opp-fields.test.ts \
            src/__tests__/create-gift-overrides.integration.test.ts \
            src/__tests__/reconciliation-approve.integration.test.ts \
            src/__tests__/audit-close-resolution.integration.test.ts \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/opportunity-commitment-reconstruction.integration.test.ts

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/scripts/apply_opportunity_commitment_followups.py
          rm -f .github/workflows/apply-opportunity-commitment-followups.yml

      - name: Commit validated follow-ups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete opportunity commitment lifecycle"
          git push origin HEAD:agent/opportunity-commitment-lifecycle
