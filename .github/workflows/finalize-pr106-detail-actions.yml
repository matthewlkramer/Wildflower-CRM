name: Finalize PR 106 detail actions

on:
  push:
    branches: [main]
    paths:
      - .github/detail-actions-finalize-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: finalize-pr106-detail-actions
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_detail_actions_pr106
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_detail_actions_pr106"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TARGET_BRANCH: agent/detail-action-lifecycle-v2
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_detail_actions_pr106
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: detail-actions-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Tighten correction guards and explicit donor choice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path("artifacts/api-server/src/routes/fundraisingRecordActions.ts")
          text = route.read_text()
          old = '''      if (!gift) return null;
                if (!gift.opportunityId) return { kind: "not_linked" as const };
                formerOpportunityId = gift.opportunityId;
                await tx'''
          new = '''      if (!gift) return null;
                if (!gift.opportunityId) return { kind: "not_linked" as const };
                const linkedRecord = await tx
                  .select({
                    pledgeCommittedAt: opportunitiesAndPledges.pledgeCommittedAt,
                    commitmentPath: opportunitiesAndPledges.commitmentPath,
                    writtenPledge: opportunitiesAndPledges.writtenPledge,
                  })
                  .from(opportunitiesAndPledges)
                  .where(eq(opportunitiesAndPledges.id, gift.opportunityId))
                  .for("update")
                  .then((rows) => rows[0] ?? null);
                const finalizedPledge =
                  linkedRecord != null &&
                  (linkedRecord.pledgeCommittedAt != null ||
                    (linkedRecord.commitmentPath == null &&
                      linkedRecord.writtenPledge === true));
                if (!finalizedPledge) return { kind: "not_pledge" as const };
                formerOpportunityId = gift.opportunityId;
                await tx'''
          if old not in text:
              raise SystemExit("Could not find detach transaction anchor.")
          text = text.replace(old, new, 1)

          old = '''    if (changed.kind === "not_linked") {
                res.status(409).json({
                  error: "gift_not_on_pledge",
                  message: "This gift is already a stand-alone gift.",
                });
                return;
              }
              await applyDerivedOppFieldsMany(formerOpportunityId);'''
          new = '''    if (changed.kind === "not_linked") {
                res.status(409).json({
                  error: "gift_not_on_pledge",
                  message: "This gift is already a stand-alone gift.",
                });
                return;
              }
              if (changed.kind === "not_pledge") {
                res.status(409).json({
                  error: "gift_not_on_pledge",
                  message:
                    "This gift is linked to an opportunity rather than a finalized pledge. Use the appropriate opportunity correction instead.",
                });
                return;
              }
              await applyDerivedOppFieldsMany(formerOpportunityId);'''
          if old not in text:
              raise SystemExit("Could not find detach response anchor.")
          route.write_text(text.replace(old, new, 1))

          stripe = Path("artifacts/api-server/src/routes/stripe.ts")
          text = stripe.read_text()
          old = '''              summary:
                        "Minted gift from Stripe charge as a payment on a pledge",'''
          new = '''              summary: opp.pledgeCommittedAt
                        ? "Minted gift from Stripe charge as a payment on a pledge"
                        : "Minted stand-alone gift from Stripe charge against an opportunity",'''
          if old not in text:
              raise SystemExit("Could not find Stripe audit-summary anchor.")
          stripe.write_text(text.replace(old, new, 1))

          for filename in (
              "artifacts/wildflower-crm/src/components/record-received-gift-dialog.tsx",
              "artifacts/wildflower-crm/src/components/pending-gift-dialog.tsx",
          ):
              path = Path(filename)
              text = path.read_text()
              text = text.replace(
                  ''': donorId && !routing.isLoading && !requiresDecision\n      ?''',
                  ''': donorId && !routing.isLoading\n      ?''',
              )
              text = text.replace(
                  '''if (!paymentDonor || requiresDecision) return;''',
                  '''if (!paymentDonor) return;''',
              )
              text = text.replace(
                  '''disabled={!paymentDonor || routing.isLoading || requiresDecision}''',
                  '''disabled={!paymentDonor || routing.isLoading}''',
              )
              text = text.replace(
                  '''    !routing.isLoading &&
              !requiresDecision &&
              !create.isPending;''',
                  '''    !routing.isLoading &&
              !create.isPending;''',
              )
              text = text.replace(
                  '''This donor is set to ask each time. Choose the intended donor of
                        record directly before continuing.''',
                  '''This donor is set to ask each time. Continuing explicitly uses
                        the donor currently selected above for this record.''',
              )
              path.write_text(text)

          test = Path("artifacts/api-server/src/__tests__/fundraising-record-actions.integration.test.ts")
          text = test.read_text()
          anchor = '''const DETACH_UNIT = `${RUN}_detach_unit`;'''
          addition = '''const DETACH_UNIT = `${RUN}_detach_unit`;

          const ORDINARY_OPP = `${RUN}_ordinary_opp`;
          const ORDINARY_GIFT = `${RUN}_ordinary_gift`;'''
          if anchor not in text:
              raise SystemExit("Could not find ordinary-opportunity constant anchor.")
          text = text.replace(anchor, addition, 1)

          anchor = '''    pledgeValues(DETACH_PLEDGE, "80.00"),
            ]);'''
          addition = '''    pledgeValues(DETACH_PLEDGE, "80.00"),
              {
                id: ORDINARY_OPP,
                name: `Ordinary opportunity ${RUN}`,
                organizationId: ORG_A,
                stage: "in_conversation",
                askAmount: "40.00",
              },
            ]);'''
          if anchor not in text:
              raise SystemExit("Could not find opportunity seed anchor.")
          text = text.replace(anchor, addition, 1)

          anchor = '''    {
                  id: DETACH_GIFT,
                  organizationId: ORG_A,
                  opportunityId: DETACH_PLEDGE,
                  amount: "80.00",
                  dateReceived: "2026-02-04",
                },
              ]);'''
          addition = '''    {
                  id: DETACH_GIFT,
                  organizationId: ORG_A,
                  opportunityId: DETACH_PLEDGE,
                  amount: "80.00",
                  dateReceived: "2026-02-04",
                },
                {
                  id: ORDINARY_GIFT,
                  organizationId: ORG_A,
                  opportunityId: ORDINARY_OPP,
                  amount: "40.00",
                  dateReceived: "2026-02-05",
                },
              ]);'''
          if anchor not in text:
              raise SystemExit("Could not find gift seed anchor.")
          text = text.replace(anchor, addition, 1)

          anchor = '''  it("blocks generic gift linkage and donor edits that need correction workflows", async () => {'''
          addition = '''  it("does not detach a gift from an ordinary opportunity through the pledge correction", async () => {
              const result = await request(
                "POST",
                `/api/gifts-and-payments/${ORDINARY_GIFT}/detach-from-pledge`,
                { reason: "Incorrect correction path." },
              );
              expect(result.status).toBe(409);
              expect(result.json.error).toBe("gift_not_on_pledge");
              const [gift] = await db
                .select()
                .from(schema.giftsAndPayments)
                .where(eqFn(schema.giftsAndPayments.id, ORDINARY_GIFT));
              expect(gift.opportunityId).toBe(ORDINARY_OPP);
            });

            it("blocks generic gift linkage and donor edits that need correction workflows", async () => {'''
          if anchor not in text:
              raise SystemExit("Could not find correction-test insertion anchor.")
          test.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Reduce generated-code diff to semantic changes
        shell: bash
        run: |
          mapfile -t generated < <(
            git diff --name-only origin/main...HEAD -- \
              lib/api-client-react/src/generated \
              lib/api-zod/src/generated
          )
          semantic=()
          for file in "${generated[@]}"; do
            if ! git diff -w --quiet origin/main...HEAD -- "$file"; then
              semantic+=("$file")
            fi
          done
          printf '%s\n' "${semantic[@]}" > /tmp/semantic-generated.txt
          echo "Semantic generated files:"
          cat /tmp/semantic-generated.txt

          git restore --source=origin/main --staged --worktree -- \
            lib/api-client-react/src/generated \
            lib/api-zod/src/generated \
            lib/api-spec/codegen.sh \
            lib/api-spec/codegen-check.sh \
            .github/workflows/apply-detail-actions-v2.yml

          python3 - <<'PY'
          from pathlib import Path

          files = [
              line.strip()
              for line in Path("/tmp/semantic-generated.txt").read_text().splitlines()
              if line.strip()
          ]
          reconciliation = "lib/api-client-react/src/generated/reconciliation/reconciliation.ts"
          files = sorted(set(files + [reconciliation]))
          quoted = " \\\n".join(f'  "{item}"' for item in files)
          replacement = f'''# Normalize files whose generated schema changed, plus the historical
          # reconciliation file. Unchanged generated files retain Orval's byte shape,
          # keeping the PR focused while codegen and codegen:check remain identical.
          for rel in \\
{quoted}; do
            sed -i 's/[[:space:]]*$//' "$tmp/$rel"
          done'''

          for filename in ("codegen.sh", "codegen-check.sh"):
              path = Path("lib/api-spec") / filename
              text = path.read_text()
              old = '''# Orval emits trailing spaces in this file's bodyless mutation templates.
          # Normalize the whole file so output is byte-stable and future mutation
          # operations need no per-operation handling.
          sed -i 's/[[:space:]]*$//' \\
            "$tmp/lib/api-client-react/src/generated/reconciliation/reconciliation.ts"'''
              if old not in text:
                  raise SystemExit(f"Could not find normalization block in {path}.")
              path.write_text(text.replace(old, replacement, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format hand-edited source
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/routes/fundraisingRecordActions.ts \
            artifacts/api-server/src/routes/stripe.ts \
            artifacts/api-server/src/__tests__/fundraising-record-actions.integration.test.ts \
            artifacts/wildflower-crm/src/components/record-received-gift-dialog.tsx \
            artifacts/wildflower-crm/src/components/pending-gift-dialog.tsx

      - name: Establish disposable schema
        run: pnpm --filter @workspace/db run push-force

      - name: Regenerate and verify API clients
        run: |
          pnpm --filter @workspace/api-spec run codegen
          pnpm --filter @workspace/api-spec run codegen:check

      - name: Typecheck API and web
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/wildflower-crm run typecheck

      - name: Run focused database-backed tests
        shell: bash
        run: |
          files=(
            src/__tests__/fundraising-record-actions.integration.test.ts
            src/__tests__/gift-revert-to-opportunity.integration.test.ts
            src/__tests__/donor-attribution-phase3.integration.test.ts
            src/__tests__/opportunity-commitment-lifecycle.integration.test.ts
            src/__tests__/pledge-payment-lifecycle.integration.test.ts
          )
          existing=()
          for file in "${files[@]}"; do
            [ -f "artifacts/api-server/$file" ] && existing+=("$file")
          done
          pnpm --filter @workspace/api-server exec vitest run "${existing[@]}" --reporter=verbose

      - name: Diff integrity
        run: git diff --check origin/main...HEAD

      - name: Commit and push final PR branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Tighten and validate record-local fundraising actions"
          git push origin HEAD:$TARGET_BRANCH

      - name: Report success
        if: success()
        run: gh pr comment 106 --repo "$GITHUB_REPOSITORY" --body "Final detail-action cleanup and validation passed: focused generated diff, disposable PostgreSQL schema, generated-code consistency, API and web typechecks, focused lifecycle/payment/correction tests, and diff integrity."

      - name: Report failure
        if: failure()
        run: gh pr comment 106 --repo "$GITHUB_REPOSITORY" --body "Final detail-action cleanup or validation failed. Review the **Finalize PR 106 detail actions** workflow logs for the failing step."
