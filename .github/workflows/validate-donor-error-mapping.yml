name: Validate donor error mapping

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wf_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-attribution-phase-2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format final files
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/lib/errorCause.ts \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/__tests__/donor-routing-gift-trigger.integration.test.ts

      - run: pnpm run check:api

      - name: Prepare test database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE wf_test"
          PGPASSWORD=test psql -h localhost -U test -d wf_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          (cd lib/db && pnpm exec drizzle-kit push --force --config ./drizzle.config.ts)
          PGPASSWORD=test psql -h localhost -U test -d wf_test -v ON_ERROR_STOP=1 \
            -f lib/db/migrations/0222_donor_attribution_phase_2.sql

      - name: Run focused integration test
        run: |
          cat > artifacts/api-server/vitest.donor-error.config.ts <<'EOF'
          import { defineConfig } from "vitest/config";

          export default defineConfig({
            test: {
              pool: "forks",
              maxWorkers: 1,
              include: [
                "src/__tests__/donor-routing-gift-trigger.integration.test.ts",
              ],
              testTimeout: 30_000,
              hookTimeout: 30_000,
            },
          });
          EOF
          pnpm --filter @workspace/api-server exec vitest run \
            --config vitest.donor-error.config.ts

      - name: Commit validated cleanup
        run: |
          rm -f \
            .github/workflows/validate-donor-error-mapping.yml \
            artifacts/api-server/vitest.donor-error.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate nested donor routing errors"
          git push origin HEAD:agent/donor-attribution-phase-2
