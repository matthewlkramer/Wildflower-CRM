name: Validate detail action lifecycle

on:
  push:
    branches: [agent/detail-action-lifecycle]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_detail_actions
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildflower_detail_actions"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_detail_actions
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: detail-actions-test-key
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/detail-action-lifecycle
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert implementation is present
        run: |
          test -f artifacts/api-server/src/routes/detailActions.ts
          test -f artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx
          test -f artifacts/wildflower-crm/src/components/donor-fundraising-actions.tsx
          grep -q "convert-pledge-to-standalone-gift" artifacts/api-server/src/routes/detailActions.ts
          grep -q "rewrittenAsOriginallyStandaloneGift" artifacts/api-server/src/routes/detailActions.ts
          grep -q "Record pending gift" artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx
          ! grep -q "Record payment (via reconciliation workbench)" artifacts/wildflower-crm/src/pages/opportunity-detail.tsx
      - name: Establish schema
        run: pnpm --filter @workspace/db run push-force
      - name: API typecheck
        run: pnpm --filter @workspace/api-server typecheck
      - name: Web typecheck
        run: pnpm --filter @workspace/wildflower-crm typecheck
      - name: Focused existing lifecycle tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/gift-revert-to-opportunity.integration.test.ts \
            src/__tests__/donor-attribution-phase3.integration.test.ts \
            --reporter=verbose
      - name: Formatting and diff checks
        run: |
          pnpm exec prettier --check \
            artifacts/api-server/src/routes/detailActions.ts \
            artifacts/api-server/src/routes/giftsAndPayments.ts \
            artifacts/api-server/src/app.ts \
            artifacts/wildflower-crm/src/components/detail-action-dialogs.tsx \
            artifacts/wildflower-crm/src/components/donor-fundraising-actions.tsx \
            artifacts/wildflower-crm/src/components/create-opportunity-dialog.tsx \
            artifacts/wildflower-crm/src/components/commitment-lifecycle-card.tsx \
            artifacts/wildflower-crm/src/pages/opportunity-detail.tsx \
            artifacts/wildflower-crm/src/pages/gift-detail.tsx \
            artifacts/wildflower-crm/src/pages/individual-detail.tsx \
            artifacts/wildflower-crm/src/pages/household-detail.tsx \
            artifacts/wildflower-crm/src/pages/funding-entity-detail.tsx
          git diff --check
      - name: Record successful validation
        if: success() && github.event_name == 'push'
        run: |
          printf 'validated_commit=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > detail-actions-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add detail-actions-validation.txt
          git commit -m "Validate detail action lifecycle"
          git push origin HEAD:agent/detail-action-lifecycle
          gh pr ready 104 --repo matthewlkramer/Wildflower-CRM
        env:
          GH_TOKEN: ${{ github.token }}
