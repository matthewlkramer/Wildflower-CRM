name: Normalize reconciliation diff

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: normalize-reconciliation-diff
  cancel-in-progress: true

jobs:
  normalize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: reconciliation-test-only

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/reconciliation-state-audit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          npm install --global pnpm@10
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reduce whitespace-only diff
        run: |
          git fetch origin main
          files=(
            artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts
            artifacts/api-server/src/__tests__/workbench-deposits.integration.test.ts
          )
          index=0
          for file in "${files[@]}"; do
            patch="/tmp/reconciliation-semantic-${index}.patch"
            git diff -w --no-color origin/main HEAD -- "$file" > "$patch"
            git checkout origin/main -- "$file"
            git apply --whitespace=nowarn "$patch"
            index=$((index + 1))
          done
          git diff --check

      - name: Verify new-file formatting
        run: |
          pnpm exec prettier --check \
            artifacts/api-server/src/routes/reconciliation/workbenchDepositState.ts \
            artifacts/api-server/src/routes/reconciliation/workbenchDepositState.test.ts \
            scripts/src/audit-reconciliation.ts \
            scripts/package.json

      - name: Build test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Typecheck API and scripts
        run: |
          pnpm run check:api
          pnpm --filter @workspace/scripts run typecheck

      - name: Run focused reconciliation tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/routes/reconciliation/workbenchDepositState.test.ts
          src/__tests__/workbench-deposits.integration.test.ts

      - name: Execute read-only audit on test schema
        run: pnpm --filter @workspace/scripts run audit:reconciliation -- --json

      - name: Commit normalized validated implementation
        run: |
          rm -f .github/workflows/normalize-reconciliation-diff.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize and validate reconciliation changes"
          git push origin HEAD:agent/reconciliation-state-audit
