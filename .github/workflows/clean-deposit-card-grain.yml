name: Clean deposit card grain

on:
  push:
    branches:
      - agent/clean-deposit-card-grain

permissions:
  contents: write

concurrency:
  group: clean-deposit-card-grain
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildflower_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wildflower_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildflower_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: reconciliation-test-only

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-deposit-card-grain
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Apply presentation and query changes
        run: |
          python - <<'PY'
          from pathlib import Path

          rows_path = Path('artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx')
          rows = rows_path.read_text()

          import_anchor = 'import type { EvidencePreview } from "@/components/reconciliation-clusters/dialogs";\n'
          presentation_import = '''import {
            accountingRecordIdentity,
            dedupeAccountingGroups,
            preferStagedAccountingRecords,
            singleAllocationPresentation,
          } from "./presentation";\n'''
          if presentation_import not in rows:
              if import_anchor not in rows:
                  raise SystemExit('rows import anchor not found')
              rows = rows.replace(import_anchor, import_anchor + presentation_import, 1)

          start = rows.index('  if (composition.kind === "stripe_payout") {')
          end = rows.index('  return (\n    <div className="space-y-1.5">', start)
          stripe_block = '''  if (composition.kind === "stripe_payout") {
            const refundTotal = Number(composition.refundTotal ?? 0);
            return (
              <div className="rounded-md border border-emerald-200 bg-emerald-50/50 px-2.5 py-2 dark:border-emerald-900 dark:bg-emerald-950/30">
                <p className="text-xs font-semibold">Stripe payout · {money(composition.netTotal)} net</p>
                <p className="text-[11px] text-muted-foreground">
                  {composition.payoutDate ? formatDateShort(composition.payoutDate) : "Undated"} · {composition.payoutId} · {composition.chargeCount ?? deposit.charges.length} charge{(composition.chargeCount ?? deposit.charges.length) === 1 ? "" : "s"}
                </p>
                <p className="mt-1 text-[10px] tabular-nums text-muted-foreground">
                  Gross {money(composition.grossTotal)} − fees {money(composition.feeTotal)} − refunds {money(composition.refundTotal)} + adjustments {money(composition.adjustmentTotal)} = {money(composition.netTotal)} = bank {money(deposit.bank.amount)}
                </p>
                <div className="mt-2 space-y-1">
                  {deposit.charges.map((charge) => {
                    const refundedAmount = Number(charge.amountRefunded ?? 0);
                    const laterRefunded = charge.refunded || refundedAmount > 0;
                    const partialLaterRefund = laterRefunded && refundedAmount > 0 && refundedAmount < Number(charge.amount);
                    return (
                      <div key={charge.chargeId} className="flex items-center justify-between rounded border bg-background/80 px-2 py-1 text-[11px]">
                        <span className="truncate">{charge.payerName ?? charge.chargeId}</span>
                        <span className="flex shrink-0 items-center gap-1">
                          <span className="tabular-nums">{money(charge.amount)}</span>
                          {laterRefunded ? (
                            <Badge variant="outline" className="border-rose-300 text-[9px] text-rose-700 dark:border-rose-800 dark:text-rose-300">
                              Later refunded{partialLaterRefund ? ` · ${money(charge.amountRefunded)}` : ""}
                            </Badge>
                          ) : null}
                          {charge.exclusionReason ? <Badge variant="destructive" className="text-[9px]">Excluded</Badge> : null}
                          {actions.isFinanceOrAdmin ? (
                            <CardActionsMenu items={[
                              { label: "Exclude", onSelect: () => actions.openExclude({ kind: "charge", id: charge.chargeId, label: charge.payerName ?? charge.chargeId }) },
                              { label: "Re-include", onSelect: () => actions.reInclude({ kind: "charge", id: charge.chargeId, label: charge.payerName ?? charge.chargeId }) },
                              ...(charge.refundKind
                                ? [
                                    { label: "Confirm refund", onSelect: () => actions.openConfirmRefund(charge.chargeId, charge.refundKind === "chargeback" ? "chargeback" : "refund", charge.payerName ?? charge.chargeId) },
                                    { label: "Dismiss refund", onSelect: () => actions.openDismissRefund(charge.chargeId, charge.payerName ?? charge.chargeId) },
                                  ]
                                : []),
                            ]} />
                          ) : null}
                        </span>
                      </div>
                    );
                  })}
                  {refundTotal > 0 ? (
                    <div className="flex items-center justify-between rounded border border-rose-200 bg-rose-50/50 px-2 py-1 text-[11px] text-rose-800 dark:border-rose-900 dark:bg-rose-950/30 dark:text-rose-300">
                      <span className="truncate">Refunds settled in payout</span>
                      <span className="tabular-nums">−{money(composition.refundTotal)}</span>
                    </div>
                  ) : null}
                </div>
                <div className="mt-2 flex items-center justify-between gap-2">
                  {composition.payoutAmbiguous ? <span className="text-[10px] font-medium text-amber-700 dark:text-amber-300">guessed match</span> : <span />}
                  {actions.isFinanceOrAdmin && composition.payoutId ? (
                    <CardActionsMenu items={[
                      ...(composition.payoutAmbiguous
                        ? [{ label: "Confirm match", onSelect: () => actions.openConfirmPayoutBankMatch?.(composition.payoutId ?? "") }]
                        : []),
                      { label: "Unlink deposit", onSelect: () => actions.openUnlinkPayoutDeposit?.(composition.payoutId ?? "") },
                      { label: "Link to a different deposit…", onSelect: () => actions.openLinkPayoutDeposit?.(composition.payoutId ?? "") },
                      { label: "Resolve payout settlement", onSelect: () => actions.openSettlementSearch({ payoutId: composition.payoutId ?? "", amount: deposit.bank.amount, date: deposit.date ?? null }) },
                    ]} />
                  ) : null}
                </div>
              </div>
            );
          }
'''
          rows = rows[:start] + stripe_block + rows[end:]

          old_accounting_head = '''  const { accountingChecks: checks, qbRecords: records } = deposit;
  const checksByPayment = new Map(checks.map((check) => [check.stagedPaymentId, check]));
  const items = [
    ...records.map((record) => ({ record, check: checksByPayment.get(record.stagedPaymentId) })),
    ...checks
      .filter((check) => !records.some((record) => record.stagedPaymentId === check.stagedPaymentId))
      .map((check) => ({ record: undefined, check })),
  ];
  const nodeGroups = [
    ...deposit.composition.components.map((component) => ({
      key: `component-${component.componentId}`,
      label: componentTitle(component),
      records: component.qboRecords ?? [],
    })),
    ...deposit.charges.map((charge) => ({
      key: `charge-${charge.chargeId}`,
      label: charge.payerName ?? charge.chargeId,
      records: charge.qboRecords ?? [],
    })),
    ...deposit.gifts.map((gift) => ({
      key: `gift-${gift.giftId}`,
      label: gift.name ?? gift.giftId,
      records: gift.qboRecords ?? [],
    })),
    {
      key: "deposit",
      label: "Deposit accounting",
      records: records.filter((record) => record.role === "deposit"),
    },
  ].filter((group) => group.records.length > 0);
  const nodeRecordIds = new Set(nodeGroups.flatMap((group) => group.records.map((record) => `${record.role}:${record.stagedPaymentId}:${record.linkedChargeId ?? ""}`)));
  const unalignedItems = items.filter(({ record }) => {
    if (!record) return true;
    const linkedChargeId = "linkedChargeId" in record ? record.linkedChargeId ?? "" : "";
    return !nodeRecordIds.has(`${record.role}:${record.stagedPaymentId}:${linkedChargeId}`);
  });
  const firstRecord = records[0];
'''
          new_accounting_head = '''  const { accountingChecks: checks, qbRecords: records } = deposit;
  const visibleRecords = preferStagedAccountingRecords(records);
  const checksByPayment = new Map(checks.map((check) => [check.stagedPaymentId, check]));
  const items = [
    ...visibleRecords.map((record) => ({ record, check: checksByPayment.get(record.stagedPaymentId) })),
    ...checks
      .filter((check) => !visibleRecords.some((record) => record.stagedPaymentId === check.stagedPaymentId))
      .map((check) => ({ record: undefined, check })),
  ];
  const nodeGroups = dedupeAccountingGroups([
    ...deposit.charges.map((charge) => ({
      key: `charge-${charge.chargeId}`,
      label: charge.payerName ?? charge.chargeId,
      records: charge.qboRecords ?? [],
    })),
    ...deposit.composition.components.map((component) => ({
      key: `component-${component.componentId}`,
      label: componentTitle(component),
      records: component.qboRecords ?? [],
    })),
    {
      key: "deposit",
      label: "Deposit accounting",
      records: visibleRecords.filter((record) => record.role === "deposit"),
    },
    ...deposit.gifts.map((gift) => ({
      key: `gift-${gift.giftId}`,
      label: gift.name ?? gift.giftId,
      records: gift.qboRecords ?? [],
    })),
  ]);
  const nodeRecordIds = new Set(
    nodeGroups.flatMap((group) => group.records.map(accountingRecordIdentity)),
  );
  const unalignedItems = items.filter(({ record }) =>
    !record || !nodeRecordIds.has(accountingRecordIdentity(record)),
  );
  const firstRecord = visibleRecords[0];
'''
          if old_accounting_head not in rows:
              raise SystemExit('accounting assembly block not found')
          rows = rows.replace(old_accounting_head, new_accounting_head, 1)
          rows = rows.replace('disabled: !records.length && !checks.length', 'disabled: !visibleRecords.length && !checks.length', 1)

          old_gift_map = '''          {deposit.gifts.map((gift) => {
            const anchor = giftAnchor(gift);
            return (
'''
          new_gift_map = '''          {deposit.gifts.map((gift) => {
            const anchor = giftAnchor(gift);
            const allocations = gift.allocations ?? [];
            const allocationPresentation = singleAllocationPresentation(gift);
            return (
'''
          if old_gift_map not in rows:
              raise SystemExit('gift map block not found')
          rows = rows.replace(old_gift_map, new_gift_map, 1)

          old_allocations = '''              {(gift.allocations?.length ?? 0) > 0 ? (
                <div className="mt-1 space-y-1">
                  {gift.allocations?.map((allocation) => (
                    <div key={allocation.id} className="rounded border bg-muted/30 px-2 py-1">
                      <div className="flex items-center justify-between gap-2 text-[10px]">
                        <span className="truncate">{allocation.usage ?? "No usage coded"}</span>
                        <span className="shrink-0 tabular-nums">{money(allocation.amount)}</span>
                      </div>
                      {allocation.purpose ? <div className="whitespace-normal break-words text-[9px] text-muted-foreground">{allocation.purpose}</div> : null}
                    </div>
                  ))}
                </div>
              ) : null}
'''
          new_allocations = '''              {allocationPresentation.collapse ? (
                allocationPresentation.summary ? (
                  <p className="mt-1 whitespace-normal break-words text-[10px] text-muted-foreground">
                    {allocationPresentation.summary}
                  </p>
                ) : null
              ) : allocations.length > 0 ? (
                <div className="mt-1 space-y-1">
                  {allocations.map((allocation) => (
                    <div key={allocation.id} className="rounded border bg-muted/30 px-2 py-1">
                      <div className="flex items-center justify-between gap-2 text-[10px]">
                        <span className="truncate">{allocation.usage ?? "No usage coded"}</span>
                        <span className="shrink-0 tabular-nums">{money(allocation.amount)}</span>
                      </div>
                      {allocation.purpose ? <div className="whitespace-normal break-words text-[9px] text-muted-foreground">{allocation.purpose}</div> : null}
                    </div>
                  ))}
                </div>
              ) : null}
'''
          if old_allocations not in rows:
              raise SystemExit('allocation display block not found')
          rows = rows.replace(old_allocations, new_allocations, 1)
          rows_path.write_text(rows)

          api_path = Path('artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts')
          api = api_path.read_text()
          old_where = '''          WHERE pa_u.gift_id IS NOT NULL AND (
            pa_u.id IN (SELECT c2.payment_unit_id FROM bank_deposit_components c2 WHERE c2.bank_deposit_id = d.id)
            OR (
              pa_u.stripe_charge_id IN (
                SELECT ch2.id
                FROM stripe_staged_charges ch2
                WHERE ch2.stripe_payout_id = p.id
                  AND ch2.raw_charge->>'status' = 'succeeded'
              )
            )
          )
'''
          new_where = '''          WHERE pa_u.gift_id IS NOT NULL AND (
            (
              p.id IS NOT NULL
              AND pa_u.stripe_charge_id IN (
                SELECT ch2.id
                FROM stripe_staged_charges ch2
                WHERE ch2.stripe_payout_id = p.id
                  AND ch2.raw_charge->>'status' = 'succeeded'
              )
            )
            OR (
              (
                p.id IS NULL
                OR NOT EXISTS (
                  SELECT 1
                  FROM payment_units charge_gift_unit
                  JOIN stripe_staged_charges charge_gift
                    ON charge_gift.id = charge_gift_unit.stripe_charge_id
                  WHERE charge_gift.stripe_payout_id = p.id
                    AND charge_gift_unit.gift_id IS NOT NULL
                )
              )
              AND pa_u.id IN (
                SELECT c2.payment_unit_id
                FROM bank_deposit_components c2
                WHERE c2.bank_deposit_id = d.id
              )
            )
          )
'''
          if old_where not in api:
              raise SystemExit('gift authority query block not found')
          api_path.write_text(api.replace(old_where, new_where, 1))

          test_path = Path('artifacts/api-server/src/__tests__/workbench-deposits.integration.test.ts')
          test = test_path.read_text()
          insert_before = '  it("surfaces correction_needed accounting checks for component units", async () => {'
          if insert_before not in test:
              raise SystemExit('integration insertion point not found')
          overlap_test = '''  it("prefers charge-grain gifts when a Stripe payout also carries a legacy component gift", async () => {
            const deposit = await seedDeposit("Stripe charge gift authority", "20.00");
            const payout = await seedPayout("20.00", deposit);
            const chargeGiftIds: string[] = [];

            for (let index = 0; index < 4; index += 1) {
              const charge = await seedCharge(payout, { grossAmount: "5.00" });
              const giftId = nextId(`charge_gift_${index}`);
              const unitId = nextId(`charge_unit_${index}`);
              await db.insert(schema.giftsAndPayments).values({
                id: giftId,
                name: `Charge gift ${index + 1}`,
                amount: "5.00",
                dateReceived: "2099-12-31",
                organizationId: ORG_ID,
              });
              giftIds.push(giftId);
              chargeGiftIds.push(giftId);
              await db.insert(schema.paymentUnits).values({
                id: unitId,
                kind: "stripe_charge",
                stripeChargeId: charge,
                grossAmount: "5.00",
                feeAmount: "0.00",
                netAmount: "5.00",
                receivedDate: "2099-12-31",
                giftId,
                giftMatchMethod: "human",
              });
              unitIds.push(unitId);
            }

            const legacyGiftId = nextId("legacy_component_gift");
            const legacyUnitId = nextId("legacy_component_unit");
            const legacyComponentId = nextId("legacy_component");
            await db.insert(schema.giftsAndPayments).values({
              id: legacyGiftId,
              name: "Legacy payout-level gift",
              amount: "20.00",
              dateReceived: "2099-12-31",
              organizationId: ORG_ID,
            });
            giftIds.push(legacyGiftId);
            await db.insert(schema.paymentUnits).values({
              id: legacyUnitId,
              kind: "other",
              grossAmount: "20.00",
              netAmount: "20.00",
              receivedDate: "2099-12-31",
              giftId: legacyGiftId,
              giftMatchMethod: "human",
            });
            unitIds.push(legacyUnitId);
            await db.insert(schema.bankDepositComponents).values({
              id: legacyComponentId,
              bankDepositId: deposit,
              paymentUnitId: legacyUnitId,
              amount: "20.00",
              source: "manual",
            });
            componentIds.push(legacyComponentId);

            const result = await listDeposits("completed", "Stripe charge gift authority");
            const row = result.data.find((item: any) => item.anchorId === deposit);
            expect(row?.charges).toHaveLength(4);
            expect(row?.gifts.map((item: any) => item.giftId).sort()).toEqual(
              [...chargeGiftIds].sort(),
            );
            expect(row?.gifts.some((item: any) => item.giftId === legacyGiftId)).toBe(false);
          });

'''
          test_path.write_text(test.replace(insert_before, overlap_test + insert_before, 1))
          PY

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/rows.tsx \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/presentation.ts \
            artifacts/wildflower-crm/src/components/reconciliation-deposits/presentation.test.ts \
            artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts \
            artifacts/api-server/src/__tests__/workbench-deposits.integration.test.ts

      - name: Build schema and typecheck
        run: |
          pnpm --filter @workspace/db run push-force
          pnpm run check:api
          pnpm run check:web

      - name: Run focused tests
        run: |
          pnpm --filter @workspace/wildflower-crm exec vitest run \
            src/components/reconciliation-deposits/presentation.test.ts
          pnpm --filter @workspace/api-server exec vitest run \
            src/routes/reconciliation/workbenchDepositState.test.ts \
            src/__tests__/workbench-deposits.integration.test.ts

      - name: Commit validated implementation
        run: |
          rm .github/workflows/clean-deposit-card-grain.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up deposit card grain and accounting duplicates"
          git push origin HEAD:agent/clean-deposit-card-grain
