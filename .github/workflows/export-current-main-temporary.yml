name: Temporary export current main

on:
  push:
    branches: [main]
    paths:
      - .github/export-current-main-trigger.txt

permissions:
  contents: write

actions:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/wildflower-current-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: wildflower-current-main
          path: /tmp/wildflower-current-main.tar.gz
          retention-days: 1
      - name: Record run id
        run: |
          printf 'run_id=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .github/export-current-main-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/export-current-main-run.txt
          git commit -m "Record temporary current-main export run"
          git push origin HEAD:main
