name: Inspect candidate payment API

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workbench-alignment-search-undo
      - name: Print exact candidate and attach routes
        run: |
          FILE=artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts
          echo '=== CANDIDATE ROUTE 1740-1900 ==='
          sed -n '1740,1900p' "$FILE"
          echo '=== ADD COMPONENT 1900-2205 ==='
          sed -n '1900,2205p' "$FILE"
          echo '=== REMOVE COMPONENT 2290-2390 ==='
          sed -n '2290,2390p' "$FILE"
          echo '=== API TYPES ==='
          grep -RniE 'DepositCandidatePaymentUnit|ListDepositCandidatePaymentUnits|AddBankDepositComponent' lib/openapi.yaml lib/api-zod/src lib/api-client-react/src 2>/dev/null | head -160 || true
          echo '=== AUDIT HELPERS ==='
          sed -n '1,260p' artifacts/api-server/src/lib/reconciliationAudit.ts
