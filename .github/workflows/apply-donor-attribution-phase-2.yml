name: Apply donor attribution phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wf_test
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-attribution-phase-2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify and apply implementation
        run: |
          wc -c .github/scripts/donor-phase2.0{0,1,2,3,4,5,6}
          sha256sum .github/scripts/donor-phase2.0{0,1,2,3,4,5,6}
          test "$(sha256sum .github/scripts/donor-phase2.00 | cut -d' ' -f1)" = "706a81992ea83575645df6082e96bcdda9910848a9fded801074fd93d0999402"
          test "$(sha256sum .github/scripts/donor-phase2.01 | cut -d' ' -f1)" = "9cc909e8d246f8c624e7ec3e867c136f62686c238e543ec1a8cd6304c8da4535"
          test "$(sha256sum .github/scripts/donor-phase2.02 | cut -d' ' -f1)" = "3ed8578d97a25411b5195c908d3ccbb8d31a5dc9e695167c28e3d8622b15bc6a"
          test "$(sha256sum .github/scripts/donor-phase2.03 | cut -d' ' -f1)" = "847d500a813e475d0f87849b492c2701df7778e16b9e90f124e8450e7c785f06"
          test "$(sha256sum .github/scripts/donor-phase2.04 | cut -d' ' -f1)" = "500471726863edd9c37e98b29ef6d3339f1228fd302244ea8ca69638a0f343da"
          test "$(sha256sum .github/scripts/donor-phase2.05 | cut -d' ' -f1)" = "dccf73a65d58951967c52025d654146611cf42787910636a19281511ac61c3d5"
          test "$(sha256sum .github/scripts/donor-phase2.06 | cut -d' ' -f1)" = "04e1d8e75f366696272172346e7b277e382b37e6ce86cb9235c9f9319e28445b"
          cat .github/scripts/donor-phase2.0{0,1,2,3,4,5,6} > /tmp/donor-phase2.b64
          base64 -d /tmp/donor-phase2.b64 > /tmp/donor-phase2.py.gz
          gzip -t /tmp/donor-phase2.py.gz
          gzip -d -c /tmp/donor-phase2.py.gz > /tmp/apply_donor_attribution_phase2.py
          python /tmp/apply_donor_attribution_phase2.py
          python - <<'PY'
          from pathlib import Path
          import re

          test_path = Path("artifacts/api-server/src/__tests__/donor-routing-gift-trigger.integration.test.ts")
          test_text = test_path.read_text()
          old = '''    await expect(insertGift("ask")).rejects.toThrow(
                /donor_routing_decision_required/,
              );'''
          new = '''    let thrown: unknown;
              try {
                await insertGift("ask");
              } catch (error) {
                thrown = error;
              }
              expect(thrown).toBeTruthy();
              expect(String((thrown as { cause?: unknown }).cause ?? thrown)).toContain(
                "donor_routing_decision_required",
              );'''
          if old not in test_text:
              raise SystemExit("ask-path assertion pattern not found")
          test_path.write_text(test_text.replace(old, new))

          pattern = re.compile(
              r'((?:g\.)?household_id)\s*=\s*\(\s*SELECT primary_household_id FROM people\s*WHERE id = \$\{PEOPLE_ID\}\s*\)',
              re.MULTILINE,
          )
          replacement = r'\1 = ${sql.raw(`"people"."primary_household_id"`)}'
          total = 0
          for relative in (
              "artifacts/api-server/src/routes/people.ts",
              "artifacts/api-server/src/routes/topPriorities.ts",
          ):
              path = Path(relative)
              text = path.read_text()
              text, count = pattern.subn(replacement, text)
              if count == 0:
                  raise SystemExit(f"primary-household correlation pattern not found in {relative}")
              total += count
              path.write_text(text)
          print(f"fixed {total} primary-household correlation expressions")

          soft_path = Path("artifacts/api-server/src/__tests__/people-org-soft-credit.integration.test.ts")
          soft_text = soft_path.read_text()
          old_helper = '''async function seedHouseholdMembership(personId: string, householdId: string): Promise<void> {
            const id = nextId("role");
            await db.insert(schema.peopleEntityRoles).values({
              id,
              personId,
              entityType: "household",
              householdId,
              current: "current",
            });
            seededRoleIds.push(id);
          }'''
          new_helper = '''async function seedHouseholdMembership(personId: string, householdId: string): Promise<void> {
            const id = nextId("role");
            await db.insert(schema.peopleEntityRoles).values({
              id,
              personId,
              entityType: "household",
              householdId,
              current: "current",
            });
            await db
              .update(schema.people)
              .set({ primaryHouseholdId: householdId })
              .where(eqFn(schema.people.id, personId));
            seededRoleIds.push(id);
          }'''
          if old_helper not in soft_text:
              raise SystemExit("household test helper pattern not found")
          soft_path.write_text(soft_text.replace(old_helper, new_helper))
          PY

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Format changed source files
        run: |
          pnpm exec prettier --write \
            lib/db/src/schema/donorRoutingPreferences.ts \
            artifacts/api-server/src/lib/donorRouting.ts \
            artifacts/api-server/src/routes/donorRouting.ts \
            artifacts/api-server/src/routes/people.ts \
            artifacts/api-server/src/routes/households.ts \
            artifacts/api-server/src/routes/organizations.ts \
            artifacts/api-server/src/routes/topPriorities.ts \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/__tests__/donor-routing.integration.test.ts \
            artifacts/api-server/src/__tests__/people-org-soft-credit.integration.test.ts \
            artifacts/api-server/src/__tests__/donor-routing-gift-trigger.integration.test.ts \
            artifacts/wildflower-crm/src/components/preferred-donor-card.tsx \
            .agents/memory/individual-org-soft-credit.md \
            docs/donor-attribution-phase-2.md

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web

      - name: Prepare donor-attribution test database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE wf_test"
          PGPASSWORD=test psql -h localhost -U test -d wf_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          (cd lib/db && pnpm exec drizzle-kit push --force --config ./drizzle.config.ts)
          PGPASSWORD=test psql -h localhost -U test -d wf_test -v ON_ERROR_STOP=1 \
            -f lib/db/migrations/0222_donor_attribution_phase_2.sql

      - name: Run donor-attribution integration tests
        run: |
          cat > artifacts/api-server/vitest.donor-attribution.config.ts <<'EOF'
          import { defineConfig } from "vitest/config";

          export default defineConfig({
            test: {
              pool: "forks",
              maxWorkers: 1,
              include: [
                "src/__tests__/donor-routing.integration.test.ts",
                "src/__tests__/people-org-soft-credit.integration.test.ts",
                "src/__tests__/donor-routing-gift-trigger.integration.test.ts",
              ],
              testTimeout: 30_000,
              hookTimeout: 30_000,
            },
          });
          EOF
          pnpm --filter @workspace/api-server exec vitest run \
            --config vitest.donor-attribution.config.ts

      - name: Remove one-time harness
        run: |
          rm -f \
            .github/scripts/apply_donor_attribution_phase2.py.gz.b64 \
            .github/scripts/donor-phase2.00 \
            .github/scripts/donor-phase2.01 \
            .github/scripts/donor-phase2.02 \
            .github/scripts/donor-phase2.03 \
            .github/scripts/donor-phase2.04 \
            .github/scripts/donor-phase2.05 \
            .github/scripts/donor-phase2.06 \
            .github/run-donor-attribution-phase-2 \
            .github/workflows/apply-donor-attribution-phase-2.yml \
            artifacts/api-server/vitest.donor-attribution.config.ts

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement donor attribution phase 2"
          git push origin HEAD:agent/donor-attribution-phase-2
