name: Apply donor attribution phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wf_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-attribution-phase-2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply implementation
        run: |
          wc -c .github/scripts/donor-phase2.00 .github/scripts/donor-phase2.01 .github/scripts/donor-phase2.02
          sha256sum .github/scripts/donor-phase2.00 .github/scripts/donor-phase2.01 .github/scripts/donor-phase2.02
          test "$(sha256sum .github/scripts/donor-phase2.00 | cut -d' ' -f1)" = "d9b9b906701f9ebd807e8752c87972e0fc604f99757a36512336b12b3f8e5ca9"
          test "$(sha256sum .github/scripts/donor-phase2.01 | cut -d' ' -f1)" = "a5836f956a45db729afee0f1571ecc354e125d0c28ceca905fd5970a68815468"
          test "$(sha256sum .github/scripts/donor-phase2.02 | cut -d' ' -f1)" = "0d015c9f8063805de4f62e866a86151fb54b5530741bc183aab4a04230095651"
          cat .github/scripts/donor-phase2.00 \
              .github/scripts/donor-phase2.01 \
              .github/scripts/donor-phase2.02 \
            > /tmp/donor-phase2.b64
          base64 -d /tmp/donor-phase2.b64 > /tmp/donor-phase2.py.gz
          gzip -t /tmp/donor-phase2.py.gz
          gzip -d -c /tmp/donor-phase2.py.gz > /tmp/apply_donor_attribution_phase2.py
          python /tmp/apply_donor_attribution_phase2.py

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Format changed source files
        run: |
          pnpm exec prettier --write \
            lib/db/src/schema/donorRoutingPreferences.ts \
            artifacts/api-server/src/lib/donorRouting.ts \
            artifacts/api-server/src/routes/donorRouting.ts \
            artifacts/api-server/src/routes/people.ts \
            artifacts/api-server/src/routes/households.ts \
            artifacts/api-server/src/routes/organizations.ts \
            artifacts/api-server/src/routes/topPriorities.ts \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/__tests__/donor-routing.integration.test.ts \
            artifacts/api-server/src/__tests__/people-org-soft-credit.integration.test.ts \
            artifacts/api-server/src/__tests__/donor-routing-gift-trigger.integration.test.ts \
            artifacts/wildflower-crm/src/components/preferred-donor-card.tsx \
            .agents/memory/individual-org-soft-credit.md \
            docs/donor-attribution-phase-2.md

      - run: pnpm run check:codegen
      - run: pnpm run check:api
      - run: pnpm run check:web

      - name: Prepare donor-attribution test database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE wf_test"
          PGPASSWORD=test psql -h localhost -U test -d wf_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          (cd lib/db && pnpm exec drizzle-kit push --force --config ./drizzle.config.ts)
          PGPASSWORD=test psql -h localhost -U test -d wf_test -v ON_ERROR_STOP=1 \
            -f lib/db/migrations/0222_donor_attribution_phase_2.sql

      - name: Run donor-attribution integration tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run --project integration \
            src/__tests__/donor-routing.integration.test.ts \
            src/__tests__/people-org-soft-credit.integration.test.ts \
            src/__tests__/donor-routing-gift-trigger.integration.test.ts

      - name: Remove one-time harness
        run: |
          rm -f \
            .github/scripts/apply_donor_attribution_phase2.py.gz.b64 \
            .github/scripts/donor-phase2.00 \
            .github/scripts/donor-phase2.01 \
            .github/scripts/donor-phase2.02 \
            .github/run-donor-attribution-phase-2 \
            .github/workflows/apply-donor-attribution-phase-2.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement donor attribution phase 2"
          git push origin HEAD:agent/donor-attribution-phase-2
