name: Materialize reconciliation source fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-relink-conflicts-and-completion.yml
      - scripts/apply-relink-conflicts-and-completion.py
      - scripts/refine-provisional-composition.py

permissions:
  contents: write

concurrency:
  group: materialize-reconciliation-source-fixes
  cancel-in-progress: false

jobs:
  apply-and-commit:
    if: github.head_ref == 'agent/materialize-reconciliation-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/materialize-reconciliation-fixes

      - name: Apply reviewed source transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-relink-conflicts-and-completion.py")
          text = path.read_text()
          path.write_text(text.replace("correction_needed' '''", "correction_needed'''"))
          PY
          python scripts/apply-relink-conflicts-and-completion.py
          python scripts/refine-provisional-composition.py

      - name: Verify expected fixes are present
        run: |
          grep -q 'extractGateIssues' artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx
          grep -q 'displaceLinkedPayment' artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx
          grep -q 'moveOwnApplication' artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx
          grep -q 'excludedQbPaymentIds' artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts
          grep -q "COALESCE(qsp.funding_source, '') <> 'stripe'" artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts
          grep -q 'Matched gift plus excluded payment' artifacts/api-server/src/__tests__/workbench-deposits.integration.test.ts
          git diff --check

      - name: Commit real source files to the branch
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add \
            artifacts/wildflower-crm/src/pages/reconciliation-deposits.tsx \
            artifacts/api-server/src/routes/reconciliation/workbenchDeposits.ts \
            artifacts/api-server/src/__tests__/workbench-deposits.integration.test.ts
          git rm -f \
            .github/workflows/apply-relink-conflicts-and-completion.yml \
            scripts/apply-relink-conflicts-and-completion.py \
            scripts/refine-provisional-composition.py
          git commit -m "Fix relinking and excluded-payment completion"
          git push origin HEAD:agent/materialize-reconciliation-fixes
