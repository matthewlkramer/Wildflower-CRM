name: Patch primary donor normalization

on:
  push:
    branches: [agent/normalize-donor-clusters-all-lifecycle]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/normalize-donor-clusters-all-lifecycle
          fetch-depth: 0

      - name: Make production-specific routing seeds portable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path("lib/db/migrations/0225_normalize_primary_donor_paths.sql")
          sql = migration.read_text()

          peretsman_marker = "INSERT INTO donor_routing_preferences (\n  id,\n  source_kind,\n  source_household_id,"
          if sql.count(peretsman_marker) != 1:
              raise RuntimeError("Could not locate Peretsman route insert")
          sql = sql.replace(
              peretsman_marker,
              "DO $peretsman_route$\nBEGIN\n  IF EXISTS (\n    SELECT 1 FROM households\n    WHERE id = 'recIJTPGCH2DtgplA' AND archived_at IS NULL\n  ) AND EXISTS (\n    SELECT 1 FROM organizations\n    WHERE id = 'recEnJihmxpxL6Mes' AND archived_at IS NULL\n  ) THEN\n" + peretsman_marker,
              1,
          )
          peretsman_end = "  updated_by_user_id = NULL,\n  updated_at = now();\n\n-- Every Avi/Sandra Nash record"
          if sql.count(peretsman_end) != 1:
              raise RuntimeError("Could not locate Peretsman route insert end")
          sql = sql.replace(
              peretsman_end,
              "  updated_by_user_id = NULL,\n  updated_at = now();\n  END IF;\nEND;\n$peretsman_route$;\n\n-- Every Avi/Sandra Nash record",
              1,
          )

          nash_marker = "INSERT INTO donor_routing_preferences (\n  id,\n  source_kind,\n  source_organization_id,"
          if sql.count(nash_marker) != 1:
              raise RuntimeError("Could not locate Nash route insert")
          sql = sql.replace(
              nash_marker,
              "DO $nash_route$\nBEGIN\n  IF EXISTS (\n    SELECT 1 FROM organizations\n    WHERE id = 'recR28K8Twq5uV8Q0' AND archived_at IS NULL\n  ) AND EXISTS (\n    SELECT 1 FROM households\n    WHERE id = 'rec673AHumJJiIPSy' AND archived_at IS NULL\n  ) THEN\n" + nash_marker,
              1,
          )
          nash_end = "  updated_by_user_id = NULL,\n  updated_at = now();\n\nCREATE TEMP TABLE donor_cluster_map"
          if sql.count(nash_end) != 1:
              raise RuntimeError("Could not locate Nash route insert end")
          sql = sql.replace(
              nash_end,
              "  updated_by_user_id = NULL,\n  updated_at = now();\n  END IF;\nEND;\n$nash_route$;\n\nCREATE TEMP TABLE donor_cluster_map",
              1,
          )

          route_audit_anchor = "INSERT INTO audit_log (\n  id,\n  actor_user_id,\n  action,\n  entity_type,\n  entity_id,\n  summary,\n  metadata,\n  created_at\n)\nVALUES\n"
          if sql.count(route_audit_anchor) != 1:
              raise RuntimeError("Could not locate route-audit insert")
          sql = sql.replace(
              route_audit_anchor,
              "INSERT INTO audit_log (\n  id,\n  actor_user_id,\n  action,\n  entity_type,\n  entity_id,\n  summary,\n  metadata,\n  created_at\n)\nSELECT * FROM (VALUES\n",
              1,
          )
          audit_end = ")\nON CONFLICT (id) DO NOTHING;\n\nCOMMIT;"
          if sql.count(audit_end) != 1:
              raise RuntimeError("Could not locate route-audit insert end")
          sql = sql.replace(
              audit_end,
              ") AS route_audit(\n  id, actor_user_id, action, entity_type, entity_id, summary, metadata, created_at\n)\nWHERE (\n  route_audit.id = 'audit_donor_route_0225_peretsman_household'\n  AND EXISTS (SELECT 1 FROM households WHERE id = 'recIJTPGCH2DtgplA')\n) OR (\n  route_audit.id = 'audit_donor_route_0225_indira_household'\n  AND EXISTS (SELECT 1 FROM organizations WHERE id = 'recR28K8Twq5uV8Q0')\n)\nON CONFLICT (id) DO NOTHING;\n\nCOMMIT;",
              1,
          )
          migration.write_text(sql)

          validation = Path(".github/workflows/validate-primary-donor-lifecycle-normalization.yml")
          workflow = validation.read_text()
          old = "      - name: Establish current schema\n        run: pnpm --filter @workspace/db run push-force\n"
          new = "      - name: Establish current schema and verify migration portability\n        run: |\n          pnpm --filter @workspace/db run push-force\n          psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f lib/db/migrations/0225_normalize_primary_donor_paths.sql\n"
          if workflow.count(old) != 1:
              raise RuntimeError("Could not locate schema establishment step")
          workflow = workflow.replace(old, new, 1)
          if workflow.count("< 8") != 1:
              raise RuntimeError("Could not locate audit-count assertion")
          workflow = workflow.replace("< 8", "< 7", 1)
          validation.write_text(workflow)

          docs = Path("docs/donor-attribution-export.md")
          doc = docs.read_text()
          old_doc = "This export is for reviewing preferred donor pathways, household groupings, DAF\nusage, and inconsistent donor attribution against production-shaped data."
          new_doc = "This export is for reviewing preferred donor pathways, household groupings, DAF\nusage, and inconsistent gift, opportunity, and pledge attribution against\nproduction-shaped data."
          if doc.count(old_doc) != 1:
              raise RuntimeError("Could not locate export documentation description")
          docs.write_text(doc.replace(old_doc, new_doc, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-primary-donor-normalization.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden donor lifecycle normalization"
          git push origin HEAD:agent/normalize-donor-clusters-all-lifecycle
