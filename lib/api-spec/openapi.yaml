        screenshotFilename: { type: string, nullable: true }
        screenshotStatus:
          { $ref: "#/components/schemas/AppFeedbackScreenshotStatus" }
        screenshotError: { type: string, nullable: true }
        adminNotes: { type: string, nullable: true }
        resolvedByUserId: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reporter: { $ref: "#/components/schemas/AppFeedbackPerson" }
        resolver:
          allOf: [{ $ref: "#/components/schemas/AppFeedbackPerson" }]
          nullable: true
        proposal:
          allOf: [{ $ref: "#/components/schemas/AppFeedbackProposal" }]
          nullable: true
        viewerCanImplement:
          type: boolean
          description: >-
            Whether the authenticated viewer may start the implementation
            handoff. The API remains authoritative even when the UI hides the
            action.
    CreateAppFeedbackBody:
      type: object
      required: [message, pageUrl, pagePath]
      properties:
        category:
          allOf: [{ $ref: "#/components/schemas/AppFeedbackCategory" }]
          default: bug
        message: { type: string, minLength: 1, maxLength: 10000 }
        pageUrl: { type: string, minLength: 1, maxLength: 5000 }
        pagePath: { type: string, minLength: 1, maxLength: 3000 }
        pageTitle: { type: string, maxLength: 500, nullable: true }
        context: { type: object, additionalProperties: true, default: {} }
        screenshotUrl:
          type: string
          pattern: "^/api/storage/objects/"
          maxLength: 2048
          nullable: true
        screenshotFilename: { type: string, maxLength: 500, nullable: true }
        screenshotStatus:
          allOf: [{ $ref: "#/components/schemas/AppFeedbackScreenshotStatus" }]
          default: skipped
        screenshotError: { type: string, maxLength: 2000, nullable: true }
    UpdateAppFeedbackBody:
      type: object
      properties:
        status: { $ref: "#/components/schemas/AppFeedbackStatus" }
        adminNotes: { type: string, maxLength: 20000, nullable: true }
    ReviseAppFeedbackProposalBody:
      type: object
      required: [reviewerGuidance]
      properties:
        reviewerGuidance: { type: string, minLength: 1, maxLength: 20000 }
    AppFeedbackList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AppFeedbackItem" }
        pagination: { $ref: "#/components/schemas/Pagination" }
