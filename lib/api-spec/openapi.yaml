der],
            description: "Archive only this lead, or also suppress future ingests for its named program or funder.",
          }
    SplitGrantLeadBody:
      type: object
      required: [newTitle]
      properties:
        newTitle:
          {
            type: string,
            description: "Title for the newly created split-off lead.",
          }
        newFunderName:
          {
            type: string,
            description: "Funder name for the split-off lead (optional).",
          }
    SplitGrantLeadResponse:
      type: object
      required: [original, splitOff]
      properties:
        original: { $ref: "#/components/schemas/GrantLead" }
        splitOff: { $ref: "#/components/schemas/GrantLeadDetail" }
    ConvertGrantLeadBody:
      type: object
      properties:
        organizationId: { type: string, description: "Donor org (Donor XOR)." }
        individualGiverPersonId:
          { type: string, description: "Individual donor (Donor XOR)." }
        householdId:
          { type: string, description: "Household donor (Donor XOR)." }
        ownerUserId:
          {
            type: string,
            description: "Opportunity owner (defaults to caller).",
          }
        name:
          {
            type: string,
            description: "Opportunity name (defaults to lead title).",
          }
        askAmount:
          { type: string, description: "Ask amount in decimal string form." }
        applicationDeadline:
          {
            type: string,
            format: date,
            description: "Application deadline (defaults to lead deadline).",
          }
    ConvertGrantLeadResponse:
      type: object
      required: [grantLead, opportunity]
      properties:
        grantLead: { $ref: "#/components/schemas/GrantLead" }
        opportunity:
          { type: object, description: "The newly created opportunity row." }

    # ─── Meeting notes ────────────────────────────────────────────────────────
    MeetingActionItem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        assigneeName:
          {
            type: string,
            nullable: true,
            description: "Free-text assignee name as extracted from the transcript.",
          }
        dueDate: { type: string, format: date, nullable: true }
        promotedTaskId:
          {
            type: string,
            nullable: true,
            description: "Set after this item was promoted into a task via /promote-action-item.",
          }
    MeetingNote:
      type: object
      required:
        [id, meetingDate, summaryOnly, creatorUserId, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        meetingDate: { type: string, format: date-time }
        attendees: { type: array, items: { type: string }, nullable: true }
        rawTranscript:
          {
            type: string,
            nullable: true,
            description: "Always null when summaryOnly is true.",
          }
        summaryOnly:
          {
            type: boolean,
            description: "Snapshot of the creator's email_sync_mode at create time. When true, the raw transcript was dropped pre-insert.",
          }
        aiSummary: { type: string, nullable: true }
        actionItems:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/MeetingActionItem" }
        creatorUserId: { type: string }
        personId: { type: string, nullable: true }
        organizationId: { type: string, nullable: true }
        householdId: { type: string, nullable: true }
        calendarEventId:
          {
            type: string,
            nullable: true,
            description: "Direct pointer to the synced calendar event this note documents.",
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MeetingNoteList:
      type: object
      required: [data, pagination]
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/MeetingNote" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    CreateMeetingNoteBody:
      type: object
      description: "Exactly one of personId / funderId / householdId must be set (contact XOR). Exactly one of `transcript` or `summary` must be provided — `transcript` runs through AI summarization, `summary` is stored verbatim as the note body (used by the hand-typed-notes flow)."
      properties:
        transcript:
          {
            type: string,
            description: "Raw pasted transcript. Dropped server-side before insert when the caller's email_sync_mode is summary_only. Runs through AI summarization to produce aiSummary + actionItems.",
          }
        summary:
          {
            type: string,
            description: "Hand-typed notes. Stored verbatim as aiSummary with no AI processing; no rawTranscript or actionItems are generated. Mutually exclusive with transcript.",
          }
        title: { type: string }
        meetingDate:
          {
            type: string,
            format: date-time,
            description: "Defaults to now if omitted.",
          }
        attendees: { type: array, items: { type: string } }
        personId: { type: string }
        organizationId: { type: string }
        householdId: { type: string }
        calendarEventId: { type: string }
    UpdateMeetingNoteBody:
      type: object
      properties:
        title: { type: string, nullable: true }
        meetingDate: { type: string, format: date-time }
        attendees: { type: array, items: { type: string }, nullable: true }
        aiSummary: { type: string, nullable: true }
        actionItems:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/MeetingActionItem" }
        personId: { type: string, nullable: true }
        organizationId: { type: string, nullable: true }
        householdId: { type: string, nullable: true }
    PromoteActionItemBody:
      type: object
      required: [index]
      properties:
        index:
          { type: integer, description: "Zero-based index into actionItems[]." }
        assigneeUserId:
          {
            type: string,
            description: "Optional override; the extracted assigneeName is free-text and may not map to a user.",
          }
        dueDate: { type: string, format: date }

    # ─── Saved views ───────────────────────────────────────────────────────────
    SavedViewVisibility:
      type: string
      enum: [team, individual]
      description: "team = shared with everyone (creator-edit-only); individual = private to creator."
    SavedView:
      type: object
      required:
        [
          id,
          listKey,
          name,
          visibility,
          state,
          creatorUserId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        listKey: { type: string }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/SavedViewVisibility" }
        state:
          {
            type: object,
            additionalProperties: true,
            description: "Opaque page-specific state blob: filters + sort.",
          }
        creatorUserId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SavedViewList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SavedView" } }
    CreateSavedViewBody:
      type: object
      required: [listKey, name, visibility, state]
      properties:
        listKey: { type: string }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/SavedViewVisibility" }
        state: { type: object, additionalProperties: true }
    UpdateSavedViewBody:
      type: object
      description: "Only the creator may PATCH. All fields optional; at least one required."
      properties:
        name: { type: string }
        visibility: { $ref: "#/components/schemas/SavedViewVisibility" }
        state: { type: object, additionalProperties: true }

    # ─── Email tracking (Magio-compatible) ─────────────────────────────────
    TrackedEmail:
      type: object
      required:
        [
          id,
          subject,
          recipient,
          sender,
          recipientPersonIds,
          recipientOrganizationIds,
          recipientHouseholdIds,
          createdAt,
        ]
      properties:
        id: { type: string }
        subject: { type: string }
        recipient:
          {
            type: string,
            description: "Verbatim To: line scraped by the extension, may be a comma list.",
          }
        sender: { type: string }
        senderIp: { type: string, nullable: true }
        recipientPersonIds: { type: array, items: { type: string } }
        recipientOrganizationIds: { type: array, items: { type: string } }
        recipientHouseholdIds: { type: array, items: { type: string } }
        groupId:
          {
            type: string,
            nullable: true,
            description: "Shared across per-recipient copies of one group send; null for legacy single-pixel sends.",
          }
        gmailMessageId: { type: string, nullable: true }
        gmailThreadId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        totalViews:
          {
            type: integer,
            description: "Convenience aggregate; present on list/detail responses.",
          }
        lastView: { type: string, format: date-time, nullable: true }
    TrackedEmailView:
      type: object
      required: [id, viewedAt]
      properties:
        id: { type: string }
        viewedAt: { type: string, format: date-time }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
    TrackedEmailWithViews:
      allOf:
        - $ref: "#/components/schemas/TrackedEmail"
        - type: object
          required: [totalViews, uniqueIps, views]
          properties:
            totalViews: { type: integer }
            uniqueIps: { type: integer }
            views:
              {
                type: array,
                items: { $ref: "#/components/schemas/TrackedEmailView" },
              }
            recipients:
              type: array
              description: "Per-recipient open breakdown. For a group send this lists every recipient with their own open counts; for a legacy single send it has one entry. Aggregate fields above sum across the group."
              items: { $ref: "#/components/schemas/TrackedEmailRecipient" }
    TrackedEmailRecipient:
      type: object
      required: [id, recipient, totalViews]
      properties:
        id:
          {
            type: string,
            description: "tracked_emails row id = this recipient's pixel id.",
          }
        recipient: { type: string }
        totalViews: { type: integer }
        lastView: { type: string, format: date-time, nullable: true }
    TrackedEmailList:
      type: object
      required: [data]
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/TrackedEmail" } }
    EmailTrackingOutboundQueueRow:
      type: object
      required:
        [
          id,
          subject,
          recipient,
          sender,
          sentAt,
          totalViews,
          laterReply,
          mailboxUserId,
        ]
      properties:
        id: { type: string }
        subject: { type: string }
        recipient: { type: string }
        sender: { type: string }
        sentAt: { type: string, format: date-time }
        totalViews: { type: integer }
        lastView: { type: string, format: date-time, nullable: true }
        laterReply: { type: boolean }
        gmailThreadId: { type: string, nullable: true }
        mailboxUserId: { type: string }
        mailboxUserName: { type: string, nullable: true }
    EmailTrackingOutboundQueue:
      type: object
      required: [data]
      properties:
        data:
          {
            type: array,
            items:
              { $ref: "#/components/schemas/EmailTrackingOutboundQueueRow" },
          }
    EmailTrackingInboundQueueRow:
      type: object
      required:
        [id, subject, fromEmail, receivedAt, mailboxUserId, senderPriority]
      properties:
        id: { type: string }
        subject: { type: string, nullable: true }
        snippet: { type: string, nullable: true }
        fromEmail: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        gmailThreadId: { type: string, nullable: true }
        mailboxUserId: { type: string }
        mailboxUserName: { type: string, nullable: true }
        senderPriority:
          { allOf: [{ $ref: "#/components/schemas/Priority" }], nullable: true }
        isPrivate: { type: boolean }
        matchedPersonIds:
          { type: array, items: { type: string }, nullable: true }
        matchedOrganizationIds:
          { type: array, items: { type: string }, nullable: true }
        matchedHouseholdIds:
          { type: array, items: { type: string }, nullable: true }
    EmailTrackingInboundQueue:
      type: object
      required: [data]
      properties:
        data:
          {
            type: array,
            items:
              { $ref: "#/components/schemas/EmailTrackingInboundQueueRow" },
          }
    EmailTrackingResolution:
      type: object
      required:
        [id, queueType, sourceId, mailboxUserId, resolvedByUserId, resolvedAt]
      properties:
        id: { type: string }
        queueType: { type: string, enum: [outbound, inbound] }
        sourceId: { type: string }
        mailboxUserId: { type: string }
        resolvedByUserId: { type: string }
        resolvedAt: { type: string, format: date-time }
    TrackedEmailStatus:
      type: object
      required: [subject, viewCount]
      properties:
        subject: { type: string }
        viewCount: { type: integer }
    CreateTrackedEmailBody:
      type: object
      required: [subject, recipient, sender]
      description: "Posted by the extension at send-time."
      properties:
        subject: { type: string }
        recipient:
          {
            type: string,
            description: "Comma- or semicolon-separated address list scraped from compose UI.",
          }
        sender: { type: string }
    SendTrackedEmailBody:
      type: object
      required: [subject, html, to]
      description: "Posted by the extension for a per-recipient (group) send."
      properties:
        subject: { type: string }
        html: { type: string, description: "Composed message body as HTML." }
        to:
          {
            type: array,
            items: { type: string },
            minItems: 1,
            description: "To: addresses (shown on every copy).",
          }
        cc:
          {
            type: array,
            items: { type: string },
            description: "Cc: addresses (shown on every copy).",
          }
        inReplyTo:
          {
            type: string,
            nullable: true,
            description: "Message-ID being replied to, for threading.",
          }
        references: { type: string, nullable: true }
    SendTrackedEmailResult:
      type: object
      required: [groupId, recipients]
      properties:
        groupId: { type: string }
        threadId:
          {
            type: string,
            nullable: true,
            description: "Shared Gmail thread id for the sent copies.",
          }
        recipients:
          type: array
          items:
            type: object
            required: [id, recipient]
            properties:
              id: { type: string }
              recipient: { type: string }
    ExtensionTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          {
            type: string,
            nullable: true,
            description: "Null when the user has not generated a token yet.",
          }

    # ─── Bulk record updates ───────────────────────────────────────────────────
    BulkUpdateResult:
      type: object
      required: [requested, succeededIds, failed]
      properties:
        requested:
          { type: integer, description: "Number of ids in the request." }
        succeededIds: { type: array, items: { type: string } }
        failed:
          type: array
          items:
            type: object
            required: [id, message]
            properties:
              id: { type: string }
              message: { type: string }
    MergeResult:
      type: object
      required: [primaryId, mergedIds]
      properties:
        primaryId: { type: string, description: "The surviving record id." }
        mergedIds:
          {
            type: array,
            items: { type: string },
            description: "Duplicate record ids that were merged into the primary and deleted.",
          }
    MergeOrganizationsBody:
      type: object
      required: [primaryId, mergeIds]
      description: "Collapse `mergeIds` (duplicates) into `primaryId` (survivor). `overrides` supplies the user-chosen winning value for each scalar field; only whitelisted funder columns are applied."
      properties:
        primaryId: { type: string }
        mergeIds:
          { type: array, items: { type: string }, minItems: 1, maxItems: 49 }
        overrides: { type: object, additionalProperties: true, nullable: true }
    MergePeopleBody:
      type: object
      required: [primaryId, mergeIds]
      description: "Collapse `mergeIds` (duplicates) into `primaryId` (survivor). `overrides` supplies the user-chosen winning value for each scalar field; only whitelisted person columns are applied."
      properties:
        primaryId: { type: string }
        mergeIds:
          { type: array, items: { type: string }, minItems: 1, maxItems: 49 }
        overrides: { type: object, additionalProperties: true, nullable: true }
    MergeGiftsBody:
      type: object
      required: [primaryId, mergeIds]
      description: "Consolidate `mergeIds` into `primaryId`. In legacy combine_amounts mode, the survivor receives the summed amount and allocations. In deduplicate mode, the survivor keeps its amount and allocations while redundant records are archived so one payment is counted once."
      properties:
        primaryId: { type: string }
        mode:
          {
            type: string,
            enum: [combine_amounts, deduplicate],
            default: combine_amounts,
            description: "combine_amounts preserves the legacy summed merge; deduplicate keeps the survivor amount and archives true duplicate records without double-counting.",
          }
        mergeIds:
          { type: array, items: { type: string }, minItems: 1, maxItems: 49 }
        organizationId: { type: string, nullable: true }
        individualGiverPersonId: { type: string, nullable: true }
        householdId: { type: string, nullable: true }
    DeduplicateOpportunitiesBody:
      type: object
      required: [primaryId, mergeIds]
      description: "Archive true duplicate opportunities into one survivor. Donor, amount, and money model must agree; duplicate child money records are never silently combined."
      properties:
        primaryId: { type: string }
        mergeIds:
          { type: array, items: { type: string }, minItems: 1, maxItems: 49 }
    OpportunityExpectedPaymentInput:
      type: object
      required: [sourceOpportunityId, expectedDate, amount]
      properties:
        sourceOpportunityId: { type: string }
        expectedDate: { type: string, format: date }
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
    CombineOpportunitiesAsPledgeBody:
      type: object
      required: [primaryId, mergeIds, commitmentDate, expectedPayments]
      description: "Turn the primary opportunity into a pledge, archive the other selected opportunities, and create one explicit expected-payment row for each source opportunity."
      properties:
        primaryId: { type: string }
        mergeIds:
          { type: array, items: { type: string }, minItems: 1, maxItems: 49 }
        name: { type: string, nullable: true }
        commitmentDate: { type: string, format: date }
        expectedPayments:
          {
            type: array,
            minItems: 2,
            maxItems: 50,
            items:
              { $ref: "#/components/schemas/OpportunityExpectedPaymentInput" },
          }
    CombineOpportunitiesAsPledgeResult:
      type: object
      required: [pledgeId, archivedOpportunityIds]
      properties:
        pledgeId: { type: string }
        archivedOpportunityIds: { type: array, items: { type: string } }
    MergeGiftsIntoPledgeBody:
      type: object
      required: [giftIds]
      description: "Attach `giftIds` to a pledge as its payments (each gift's opportunity_id is set). Provide `pledgeId` to attach to an existing pledge, OR omit it to create a NEW pledge — in which case exactly one donor field must be set (donor XOR) for the new pledge."
      properties:
        giftIds:
          { type: array, items: { type: string }, minItems: 1, maxItems: 49 }
        pledgeId:
          {
            type: string,
            nullable: true,
            description: "Existing pledge to attach to. Omit/null to create a new pledge.",
          }
        name:
          {
            type: string,
            nullable: true,
            description: "Name for the new pledge (ignored when pledgeId is set).",
          }
        organizationId: { type: string, nullable: true }
        individualGiverPersonId: { type: string, nullable: true }
        householdId: { type: string, nullable: true }
    MergeIntoPledgeResult:
      type: object
      required: [pledgeId, giftIds, created]
      properties:
        pledgeId:
          {
            type: string,
            description: "The pledge the gifts were attached to.",
          }
        giftIds:
          {
            type: array,
            items: { type: string },
            description: "The gift ids attached as payments.",
          }
        created:
          {
            type: boolean,
            description: "True if a new pledge was created, false if an existing one was used.",
          }
    SplitGiftIntoPledgeBody:
      type: object
      description: "Optional overrides when splitting a gift into a pledge. The pledge inherits the gift's donor and uses the gift amount as its awarded amount; each gift_allocation becomes one payment gift."
      properties:
        name:
          {
            type: string,
            nullable: true,
            description: "Name for the new pledge. Defaults to the gift's name.",
          }
    WriteOffPledgeBody:
      type: object
      description: "Options for an audit-close pledge write-off. The negative allocations are derived server-side pro-rata from the chosen amount."
      properties:
        reason:
          {
            type: string,
            nullable: true,
            description: "Optional free-text note explaining why the pledge is being written off (recorded on the write-off pledge's usage notes).",
          }
        amount:
          {
            type: string,
            nullable: true,
            description: "Dollar amount (major units, 2dp) of pledge commitment to write off. Independent of any payment actually received. Must be > 0 and <= the pledge's uncollected remainder net of prior active write-offs; omitted/null writes off that full net balance.",
          }
    MintGiftFromOpportunityBody:
      type: object
      description: "Options for proactively minting a gift from an opportunity/pledge. All money/donor/scope is derived server-side from the opportunity; the client only chooses the settlement-expectation flavor."
      properties:
        awaitingSettlement:
          {
            type: boolean,
            description: "Deprecated and rejected: pre-minting a gift for imminent on-books money was the duplicate-payment generator (the money later arrives and mints again via reconciliation). Sending true now 409s with awaiting_settlement_mint_removed. Expected money belongs in pledge expected payments; the gift is minted from the bank deposit when it lands. Off-books gifts (the only remaining manual mint) never settle, so the flag is meaningless here.",
          }
        offBooksException:
          {
            type: boolean,
            description: "Evidence-only escape hatch (Task #788): manual minting of a gift from a pledge/opportunity is blocked (409 manual_gift_on_pledge_blocked) — pledge payments are minted from QuickBooks evidence via reconciliation. Set true (finance/admin only) to record money that will never appear in QuickBooks. Request-level flag only; never persisted.",
          }
    ResolveGiftOverpayBody:
      type: object
      description: "Optional metadata for an audit-close gift over-payment resolution. The surplus amount is derived server-side from evidence precedence; the client never supplies amounts."
      properties:
        reason:
          {
            type: string,
            nullable: true,
            description: "Optional free-text note explaining the over-payment (recorded on the surplus gift's details).",
          }
    RevertGiftToOpportunityBody:
      type: object
      description: "Options for reverting a gift back into an opportunity. The new record inherits the gift's donor and amount; the gift's allocations are mirrored onto pledge_allocations and the gift is archived."
      properties:
        asPledge:
          type: boolean
          default: false
          description: When true, reconstruct a finalized verbal pledge with a payment schedule from the archived gift; otherwise create an open opportunity.
        name:
          {
            type: string,
            nullable: true,
            description: "Name for the new opportunity/pledge. Defaults to the gift's name.",
          }
    RevertGiftToOpportunityResult:
      type: object
      required: [opportunityId, asPledge]
      properties:
        opportunityId:
          {
            type: string,
            description: "Id of the newly created opportunities_and_pledges row.",
          }
        asPledge:
          {
            type: boolean,
            description: "Whether the new record was created as a written pledge.",
          }
    BulkArchiveBody:
      type: object
      required: [ids]
      description: "Ids of the records to archive (soft-delete). Stamps archived_at on each row instead of removing it. Processed per-row; the response reports which ids succeeded and which failed (with a reason)."
      properties:
        ids:
          { type: array, items: { type: string }, minItems: 1, maxItems: 1000 }
    BulkUpdatePeoplePatch:
      type: object
      description: "Only fields present here are written. All fields are optional and forward-only — omit to leave unchanged."
      properties:
        ownerUserId: { type: string, nullable: true }
        currentHomeRegionId: { type: string, nullable: true }
        capacityRating:
          {
            allOf: [{ $ref: "#/components/schemas/CapacityRating" }],
            nullable: true,
          }
        connectionStatus:
          {
            allOf: [{ $ref: "#/components/schemas/ConnectionStatus" }],
            nullable: true,
          }
        enthusiasm:
          {
            allOf: [{ $ref: "#/components/schemas/Enthusiasm" }],
            nullable: true,
          }
        priority:
          { allOf: [{ $ref: "#/components/schemas/Priority" }], nullable: true }
        deceased: { type: boolean }
        newsletter:
          {
            type: boolean,
            description: "Newsletter subscription flag. Changes are mirrored out to Flodesk (precedence rules apply — a Flodesk unsubscribe still wins).",
          }
        interestsThematic:
          type: array
          items: { type: string }
          description: "Thematic-interest tags on each person (people.interests_thematic). Combined with interestsThematicMode."
        interestsThematicMode:
          type: string
          enum: [replace, append]
          description: "replace = overwrite the person's interests_thematic with this set (DESTRUCTIVE). append = union this set into the existing tags."
        interestsAges:
          type: array
          items: { type: string }
          description: "Age-band interest tags on each person (people.interests_ages). Combined with interestsAgesMode."
        interestsAgesMode:
          type: string
          enum: [replace, append]
          description: "replace = overwrite (DESTRUCTIVE). append = union into existing tags."
        interestsGovModels:
          type: array
          items: { type: string }
          description: "Governance-model interest tags on each person (people.interests_gov_models). Combined with interestsGovModelsMode."
        interestsGovModelsMode:
